/* ============================================================

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function money(value) {

    return Number(value || 0)
        .toLocaleString("th-TH", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
}


function formatDate(value) {

    if (!value) {
        return "-";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleDateString(
        "th-TH",
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );
}


function showLoader(
    message = "กำลังประมวลผล..."
) {

    state.loading = true;

    const loader =
        document.getElementById(
            "globalLoader"
        );

    const text =
        document.getElementById(
            "globalLoaderText"
        );

    if (!loader || !text) {
        return;
    }

    text.textContent = message;

    loader.classList.remove("hidden");
    loader.classList.add("flex");
}


function hideLoader() {

    state.loading = false;

        document.getElementById(
            "globalLoader"
        );

    if (!loader) {
        return;
    }

    loader.classList.add("hidden");

}

        text-white

        shadow-2xl

/* ============================================================
   4. SUPABASE RPC
   ============================================================ */

/*
   ข้อความ error ที่แปลว่า session ไม่ถูกต้อง/หมดอายุ
   (หรือ role ไม่ตรงกับตอน login ซึ่งในทางปฏิบัติ
   หมายถึง session เก่าไม่ตรงกับสิทธิ์ปัจจุบันแล้ว)
*/

const SESSION_INVALID_MESSAGES = [

    "Session หมดอายุหรือไม่ถูกต้อง",

    "Session ไม่ถูกต้อง",

    "ไม่มีสิทธิ์ใช้งาน",

    "ไม่มีสิทธิ์",

    "เฉพาะ Admin เท่านั้น"

];


function isSessionInvalidMessage(
    message
) {

    return SESSION_INVALID_MESSAGES.includes(
        message
    );
}


function handleSessionExpired() {

    clearSession();

    state.currentPage =
        "dashboard";

    render();

    toast(
        "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่",
        "warning"
    );
}


async function callRpc(
    functionName,
    params = {}
) {

    try {

        const result =
            await supabaseClient.rpc(
                functionName,
                params
            );


        if (result.error) {

            console.error(
                `[RPC ERROR] ${functionName}`,
                result.error
            );

            throw new Error(
                result.error.message ||
                "เกิดข้อผิดพลาดจากระบบฐานข้อมูล"
            );
        }


        if (

            result.data &&

            result.data.success === false &&

            isSessionInvalidMessage(
                result.data.message
            ) &&

            state.sessionToken

        ) {

            handleSessionExpired();
        }


        return result.data;

    } catch (error) {

        console.error(
            `[RPC EXCEPTION] ${functionName}`,
            error
        );

        throw error;
    }
}


/*
   เรียก RPC แบบ Optional

   ใช้สำหรับ Function ที่อาจจะยังไม่ได้สร้างใน Database
*/

async function callOptionalRpc(
    functionName,
    params = {}
) {

    try {

        return await callRpc(
            functionName,
            params
        );

    } catch (error) {

        const message =
            String(
                error?.message || ""
            ).toLowerCase();


        if (
            message.includes("does not exist") ||
            message.includes("could not find")
        ) {

            return {
                success: false,
                notImplemented: true,
                message:
                    `Backend Function ${functionName} ยังไม่ได้สร้าง`
            };
        }


        throw error;
    }
}


/* ============================================================
   5. AUTHENTICATION
   ============================================================ */

async function login(
    username,
    password
) {

    if (!username || !password) {

        toast(
            "กรุณาระบุชื่อผู้ใช้และรหัสผ่าน",
            "warning"
        );

        return;
    }


    showLoader(
        "กำลังเข้าสู่ระบบ..."
    );


    try {

        const data =
            await callRpc(
                "custom_login",
                {
                    p_username:
                        username,

                    p_password:
                        password,

                    p_user_agent:
                        navigator.userAgent
                }
            );


        if (!data?.success) {

            throw new Error(
                data?.message ||
                "เข้าสู่ระบบไม่สำเร็จ"
            );
        }


        state.sessionToken =
            data.session_token;

        state.user =
            data.user;


        localStorage.setItem(
            "stips_session_token",
            state.sessionToken
        );

        localStorage.setItem(
            "stips_user",
            JSON.stringify(state.user)
        );


        state.currentPage =
            "dashboard";


        state.adminPanelOpen =
            false;


        toast(
            "เข้าสู่ระบบสำเร็จ",
            "success"
        );


        render();


        await refreshDashboard();

    } catch (error) {

        toast(
            error.message ||
            "ไม่สามารถเข้าสู่ระบบได้",
            "error"
        );

    } finally {

        hideLoader();
    }
}


async function validateSession() {

    if (!state.sessionToken) {

        return false;
    }


    try {

        const data =
            await callRpc(
                "custom_me",
                {
                    p_session_token:
                        state.sessionToken
                }
            );


        if (!data?.success) {

            clearSession();

            return false;
        }


        state.user =
            data.user;


        localStorage.setItem(
            "stips_user",
            JSON.stringify(
                state.user
            )
        );


        return true;

    } catch (error) {

        console.error(
            "Session validation failed",
            error
        );

        clearSession();

        return false;
    }
}


function clearSession() {

    state.sessionToken =
        null;

    state.user =
        null;

    state.projects =
        [];

    state.users =
        [];

    state.dashboard =
        null;

    state.selectedProject =
        null;


    localStorage.removeItem(
        "stips_session_token"
    );

    localStorage.removeItem(
        "stips_user"
    );
}


async function logout() {

    showLoader(
        "กำลังออกจากระบบ..."
    );

    try {

        if (state.sessionToken) {

            await callRpc(
                "custom_logout",
                {
                    p_session_token:
                        state.sessionToken
                }
            );
        }

    } catch (error) {

        console.warn(
            "Logout RPC error",
            error
        );

    } finally {

        clearSession();

        state.currentPage =
            "dashboard";

        hideLoader();

        render();

        toast(
            "ออกจากระบบแล้ว",
            "success"
        );
    }
}

async function refreshDashboard() {

    if (!state.user) {

    try {

        const data =
            await callRpc(
                "custom_dashboard",
                {
                    p_session_token:
                        state.sessionToken
                }
            );


        if (!data?.success) {

            throw new Error(
                data?.message ||
                "โหลด Dashboard ไม่สำเร็จ"
            );
        }


        state.dashboard =

        if (

            "dashboard"
        ) {

            render();
        }

    } catch (error) {

        toast(
            error.message,
            "error"
        );
    }
}

async function saveProject(
    event,
    projectId = null
) {

    event.preventDefault();


    const form =
        event.target;


    const formData =
        new FormData(form);


    const projectCode =
        String(
            formData.get(
                "project_code"
            ) || ""
        ).trim();


    const projectName =
        String(
            formData.get(
                "project_name"
            ) || ""
        ).trim();


    const projectType =
        formData.get(
            "project_type"
        );


    const budget =
        Number(
            formData.get(
                "budget_amount"
            )
        );


    if (!projectCode) {

        toast(
            "กรุณาระบุรหัสโครงการ",
            "warning"
        );

        return;
    }


    if (!projectName) {

        toast(
            "กรุณาระบุชื่อโครงการ",
            "warning"
        );

        return;
    }


    if (!projectType) {

        toast(
            "กรุณาเลือกประเภทโครงการ",
            "warning"
        );

        return;
    }


    if (
        !Number.isFinite(budget) ||
        budget <= 0
    ) {

        toast(
            "วงเงินงบประมาณต้องมากกว่า 0",
            "warning"
        );

        return;
    }


    showLoader(
        projectId
            ? "กำลังแก้ไขโครงการ..."
            : "กำลังสร้างโครงการ..."
    );


    try {

        let data;


        if (projectId) {

            data =
                await callRpc(
                    "custom_update_project",
                    {

                        p_session_token:
                            state.sessionToken,

                        p_project_id:
                            projectId,

                        p_project_code:
                            projectCode,

                        p_project_name:
                            projectName,

                        p_project_type:
                            projectType,

                        p_budget_amount:
                            budget

                    }
                );

        } else {

            data =
                await callRpc(
                    "custom_create_project",
                    {

                        p_session_token:
                            state.sessionToken,

                        p_project_code:
                            projectCode,

                        p_project_name:
                            projectName,

                        p_project_type:
                            projectType,

                        p_budget_amount:
                            budget

                    }
                );
        }


        if (!data?.success) {

            throw new Error(
                data?.message ||
                "บันทึกข้อมูลไม่สำเร็จ"
            );
        }


        closeModalById(
            "projectModal"
        );


        toast(
            projectId
                ? "แก้ไขโครงการสำเร็จ"
                : "สร้างโครงการสำเร็จ",
            "success"
        );


        await refreshProjects();

        await refreshDashboard();

    } catch (error) {

        toast(
            error.message,
            "error"
        );

    } finally {

        hideLoader();
    }
}

function workflowTimeline(
    project
) {

    const steps = [

        "ยังไม่ดำเนินการ",

        "จัดทำร่าง TOR",

        "เผยแพร่ร่าง TOR",

        "ประกาศเชิญชวน",

        "ประกาศผู้ชนะ",

        "รอผลอุทธรณ์",

        "ลงนามสัญญา",

        "บริหารสัญญา"

    ];


    return steps.map(
        (step, index) => {

            const number =
                index + 1;

            const isDone =
                project.current_status >
                number;

            const isCurrent =
                project.current_status ===
                number;


            return `

                <div
                    class="
                        flex

async function saveWorkflowStep(
    event
) {

    event.preventDefault();


    const wf =
        state.workflow;


    if (!wf) {
        return;
    }


    const fd =
        new FormData(
            event.target
        );


    const extraData = {};

    let completedAt = null;


    if (wf.current_status === 3) {

        const publishDate =
            fd.get("publish_date");

        const endDate =
            fd.get("end_date");


        if (!publishDate || !endDate) {

            toast(
                "กรุณาระบุวันที่เผยแพร่และวันที่สิ้นสุด",
                "warning"
            );

            return;
        }


        if (endDate < publishDate) {

            toast(
                "วันที่สิ้นสุดต้องไม่ก่อนวันที่เผยแพร่",
                "warning"
            );

            return;
        }


        extraData.publish_date =
            publishDate;

        extraData.end_date =
            endDate;

        completedAt =
            endDate;

    } else if (
        wf.current_status === 5
    ) {

        const stepDate =
            fd.get("step_date");

        const winnerName =
            String(
                fd.get("winner_name") || ""
            ).trim();


        if (!stepDate) {

            toast(
                "กรุณาระบุวันประกาศผู้ชนะ",
                "warning"
            );

            return;
        }


        if (!winnerName) {

            toast(
                "กรุณาระบุชื่อบริษัท/ร้านที่ชนะ",
                "warning"
            );

            return;
        }


        extraData.winner_name =
            winnerName;

        completedAt =
            stepDate;

    } else if (
        wf.current_status === 2 ||
        wf.current_status === 4
    ) {

        const stepDate =
            fd.get("step_date");


        if (!stepDate) {

            toast(
                "กรุณาระบุวันที่",
                "warning"
            );

            return;
        }


        completedAt =
            stepDate;

    } else {

        completedAt =
            new Date()
                .toISOString()
                .slice(0, 10);
    }


    showLoader(
        "กำลังบันทึกขั้นตอน..."
    );


    try {

        const data =
            await callRpc(
                "custom_advance_workflow",
                {

                    p_session_token:
                        state.sessionToken,

                    p_project_id:
                        wf.project_id,

                    p_completed_at:
                        completedAt,

                    p_remarks:
                        fd.get("remarks") ||
                        null,

                    p_extra_data:
                        extraData

                }
            );


        if (!data?.success) {

            throw new Error(
                data?.message ||
                "บันทึกขั้นตอนไม่สำเร็จ"
            );
        }


        toast(
            "บันทึกขั้นตอนสำเร็จ",
            "success"
        );


        if (state.selectedProject) {

            state.selectedProject.current_status =
                data.new_status;
        }


        await loadWorkflow(
            wf.project_id
        );

        await refreshProjects();

        await refreshDashboard();

    } catch (error) {

        toast(
            error.message,
            "error"
        );

    } finally {

        hideLoader();
    }
}

async function saveProfile(
    event
) {

    event.preventDefault();


    const fd =
        new FormData(
            event.target
        );


    showLoader(
        "กำลังบันทึกข้อมูล..."
    );


    try {

        const data =
            await callRpc(
                "user_update_profile",
                {

                    p_session_token:
                        state.sessionToken,

                    p_full_name:
                        fd.get(
                            "full_name"
                        ),

                    p_phone:
                        fd.get(
                            "phone"
                        ),

                    p_email:
                        fd.get(
                            "email"
                        )

                }
            );


        if (!data?.success) {

            throw new Error(
                data?.message ||
                "บันทึกไม่สำเร็จ"
            );
        }


        const session =
            await callRpc(
                "custom_me",
                {
                    p_session_token:
                        state.sessionToken
                }
            );


        if (session?.success) {

            state.user =
                session.user;


            localStorage.setItem(
                "stips_user",
                JSON.stringify(
                    state.user
                )
            );

        }


        toast(
            "บันทึกข้อมูลสำเร็จ",
            "success"
        );


        render();

    } catch (error) {

        toast(
            error.message,
            "error"
        );

    } finally {

        hideLoader();
    }
}

async function saveUser(
    event,
    userId = null
) {

    event.preventDefault();


    const fd =
        new FormData(
            event.target
        );


    showLoader(
        userId
            ? "กำลังแก้ไขผู้ใช้งาน..."
            : "กำลังสร้างผู้ใช้งาน..."
    );


    try {

        let data;


        if (userId) {

            data =
                await callRpc(
                    "admin_update_user",
                    {

                        p_session_token:
                            state.sessionToken,

                        p_user_id:
                            userId,

                        p_username:
                            fd.get(
                                "username"
                            ),

                        p_role:
                            fd.get(
                                "role"
                            ),

                        p_institution_id:
                            fd.get(
                                "institution_id"
                            ) || null,

                        p_full_name:
                            fd.get(
                                "full_name"
                            ),

                        p_phone:
                            fd.get(
                                "phone"
                            ),

                        p_email:
                            fd.get(
                                "email"
                            ),

                        p_is_active:
                            fd.get(
                                "is_active"
                            ) === "on"

                    }
                );

        } else {

            data =
                await callRpc(
                    "admin_create_user",
                    {

                        p_session_token:
                            state.sessionToken,

                        p_username:
                            fd.get(
                                "username"
                            ),

                        p_password:
                            fd.get(
                                "password"
                            ),

                        p_role:
                            fd.get(
                                "role"
                            ),

                        p_institution_id:
                            fd.get(
                                "institution_id"
                            ) || null,

                        p_full_name:
                            fd.get(
                                "full_name"
                            ),

                        p_phone:
                            fd.get(
                                "phone"
                            ),

                        p_email:
                            fd.get(
                                "email"
                            )

                    }
                );

        }


        if (!data?.success) {

            throw new Error(
                data?.message ||
                "บันทึกข้อมูลไม่สำเร็จ"
            );
        }


        closeModalById(
            "userModal"
        );


        toast(
            userId
                ? "แก้ไขผู้ใช้งานสำเร็จ"
                : "สร้างผู้ใช้งานสำเร็จ",
            "success"
        );


        await refreshUsers();

    } catch (error) {

        toast(
            error.message,
            "error"
        );

    } finally {

        hideLoader();
    }
}


/* ============================================================
   21. RESET PASSWORD
============================================================ */

function resetUserPassword(
    userId
) {

    const password =
        prompt(
            "กำหนดรหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)"
        );


    if (password === null) {
        return;
    }


    if (
        password.length < 6
    ) {

        toast(
            "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร",
            "warning"
        );

        return;
    }


    showLoader(
        "กำลังเปลี่ยนรหัสผ่าน..."
    );


    callRpc(
        "admin_reset_password",
        {

            p_session_token:
                state.sessionToken,

            p_user_id:
                userId,

            p_new_password:
                password

        }

    )
    .then(
        data => {

            if (!data?.success) {

                throw new Error(
                    data?.message ||
                    "เปลี่ยนรหัสผ่านไม่สำเร็จ"
                );
            }


            toast(
                "เปลี่ยนรหัสผ่านสำเร็จ",
                "success"
            );
        }
    )
    .catch(
        error => {

            toast(
                error.message,
                "error"
            );
        }
    )
    .finally(
        hideLoader
    );
}


/* ============================================================
   22. DELETE USER
============================================================ */

function confirmDeleteUser(
    userId
) {

    showConfirm(
        "ลบผู้ใช้งาน",
        "ยืนยันการลบบัญชีนี้หรือไม่?",
        async () => {

            showLoader(
                "กำลังลบผู้ใช้งาน..."
            );


            try {

                const data =
                    await callRpc(
                        "admin_delete_user",
                        {

                            p_session_token:
                                state.sessionToken,

                            p_user_id:
                                userId

                        }
                    );


                if (!data?.success) {

                    throw new Error(
                        data?.message ||
                        "ลบผู้ใช้งานไม่สำเร็จ"
                    );
                }


                toast(
                    "ลบผู้ใช้งานสำเร็จ",
                    "success"
                );


                await refreshUsers();

            } catch (error) {

                toast(
                    error.message,
                    "error"
                );

            } finally {

                hideLoader();
            }
        }
    );
}

function downloadCSV(
    filename,
    rows
) {

    const csv =
        rows
            .map(
                row =>
                    row
                        .map(
                            cell =>
                                `"${String(
                                    cell ?? ""
                                ).replaceAll(
                                    '"',
                                    '""'
                                )}"`
                        )
                        .join(",")
            )
            .join("\n");


    const blob =
        new Blob(
            [
                "\uFEFF" +
                csv
            ],
            {
                type:
                    "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href =
        url;


    a.download =
        filename;


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
        () =>
            URL.revokeObjectURL(url),
        500
    );
}

async function navigate(
    page
) {

    state.previousPage =
        state.currentPage;

    state.currentPage =
        page;

    state.adminPanelOpen =
        false;

    render();


    if (page === "dashboard") {

        await refreshDashboard();
    }


    if (page === "projects") {

        await refreshProjects();
    }


    if (page === "users") {

        await refreshUsers();
    }
}


function navigateProjectModule(
    module
) {

    const map = {

        workflow:
            "workflow",

        contract:
            "contract",

        installments:
            "installments",

        disbursement:
            "disbursement",

        progress:
            "contractManagement",

        appeal:
            "appeal"

    };


    if (
        !state.selectedProject
    ) {

        toast(
            "กรุณาเลือกโครงการ",
            "warning"
        );

        return;
    }


    state.currentPage =
        map[module] ||
        "projectDetail";


    if (
        state.currentPage ===
        "workflow"
    ) {

        state.workflow =
            null;
    }


    render();


    if (
        state.currentPage ===
        "workflow"
    ) {

        loadWorkflow(
            state.selectedProject.id
        );
    }
}

function closeAdminPanel(

/* ============================================================
   27. RENDER
============================================================ */

function render() {

    const root =
        document.getElementById(
            "app"
        );


    if (!root) {
        return;
    }


    /*
       Guest
    */

    if (!state.user) {

        root.innerHTML =
            renderLogin();


        const form =
            document.getElementById(
                "loginForm"
            );


        if (form) {

            form.addEventListener(
                "submit",
                event => {

                    event.preventDefault();


                    login(

                        document
                            .getElementById(
                                "loginUsername"
                            )
                            .value
                            .trim(),

                        document
                            .getElementById(
                                "loginPassword"
                            )
                            .value

                    );

                }
            );
        }


        return;
    }


    let content = "";


    switch (
        state.currentPage
    ) {

        case "dashboard":

            content =
                dashboardPage();

            break;


        case "projects":

            content =
                projectsPage();

            break;


        case "projectDetail":

            content =
                projectDetailPage();

            break;


        case "workflow":

            content =
                workflowPage();

            break;


        case "contract":

            content =
                contractPage();

            break;


        case "installments":

            content =
                installmentsPage();

            break;


        case "disbursement":

            content =
                disbursementPage();

            break;


        case "contractManagement":

            content =
                progressPage();

            break;


        case "reports":

            content =
                reportsPage();

            break;


        case "users":

            content =
                usersPage();

            break;


        case "profile":

            content =
                profilePage();

            break;


        case "appeal":

            content =
                appealPage();

            break;


        case "institutions":

            content =
                comingSoonPage(
                    "วิทยาลัย"
                );

            break;


        case "audit":

            content =
                comingSoonPage(
                    "Audit Log"
                );

            break;


        default:

            content =
                dashboardPage();

    }


    root.innerHTML =
        renderShell(
            content
        );


    /*
       Profile Form
    */

    const profileForm =
        document.getElementById(
            "profileForm"
        );


    if (profileForm) {

        profileForm.addEventListener(
            "submit",
            saveProfile
        );
    }


    /*
       Workflow Step Form
    */

    const workflowStepFormEl =
        document.getElementById(
            "workflowStepForm"
        );


    if (workflowStepFormEl) {

        workflowStepFormEl.addEventListener(
            "submit",
            saveWorkflowStep
        );
    }
}


/* ============================================================
   28. INITIALIZE
============================================================ */

async function initializeApp() {

    render();


    if (!state.sessionToken) {

        return;
    }


    showLoader(
        "กำลังตรวจสอบ Session..."
    );


    try {

        const valid =
            await validateSession();


        if (!valid) {

            render();

            return;
        }


        render();


        await refreshDashboard();

    } catch (error) {

        console.error(
            error
        );

        clearSession();

        render();

    } finally {

        hideLoader();
    }
}


/* ============================================================
   START
============================================================ */

initializeApp();
