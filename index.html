                    <button id="confirm-action-btn" class="w-full py-3 rounded-xl font-medium text-white bg-danger hover:bg-red-700 shadow-md">ยืนยัน</button>

    <div id="general-modal" class="fixed inset-0 bg-slate-900/50 z-[9000] hidden items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full sm:max-w-xl max-h-[90vh] flex flex-col shadow-2xl transition-transform transform translate-y-full sm:translate-y-0" id="general-modal-box">
            <div class="flex items-center justify-between p-5 border-b border-slate-100 shrink-0 bg-slate-50/50 rounded-t-3xl">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">หัวข้อ</h3>

    <script>
        const SUPABASE_URL = "https://jfkqxwkukotmjaeuttcs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hEoWELY_mQr3E-5ldGB4og_82jI5BY_";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        Chart.register(ChartDataLabels);
        window.stipsCharts = { stages: null, pieTypes: null, pieConst: null, pieEquip: null };
        window.leaderboardData = [];
        window.leaderboardTab = 'best'; 

        const state = { 
            sessionToken: localStorage.getItem("stips_session_token"), user: null, currentRoute: 'dashboard', projects: [], selectedProject: null, users: [], projectPage: 1, projectLimit: 10, auditPage: 1, auditLimit: 30, auditStartDate: '', auditEndDate: '', fiscalYear: null, availableYears: [], projectSearch: '', userSearch: '', auditSearch: '' 
        };

        const utils = {
            esc: (str) => String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]),
            formatMoney: (num) => Number(num || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
            formatDate: (dt) => { if(!dt) return '-'; const d = new Date(dt); return d.toLocaleDateString('th-TH', {year:'numeric',month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); },
            formatDateOnly: (dt) => { if(!dt) return '-'; const d = new Date(dt); return d.toLocaleDateString('th-TH', {year:'numeric',month:'short',day:'numeric'}); },
            getStatusName: (s) => ({ 1: 'ยังไม่ดำเนินการ', 2: 'จัดทำร่าง TOR', 3: 'เผยแพร่ร่าง TOR', 4: 'ประกาศเชิญชวน', 5: 'ประกาศผู้ชนะ', 6: 'รอผลอุทธรณ์', 7: 'ลงนามสัญญา', 8: 'บริหารสัญญา' })[s] || 'ไม่ทราบ',
            getStatusColor: (s) => ({ 1: 'bg-slate-100 text-slate-700 border-slate-200', 2: 'bg-blue-50 text-blue-700 border-blue-200', 3: 'bg-indigo-50 text-indigo-700 border-indigo-200', 4: 'bg-purple-50 text-purple-700 border-purple-200', 5: 'bg-amber-50 text-amber-700 border-amber-200', 6: 'bg-orange-50 text-orange-700 border-orange-200', 7: 'bg-emerald-50 text-emerald-700 border-emerald-200', 8: 'bg-green-100 text-green-800 border-green-200' })[s] || 'bg-slate-100'
        };

        const ui = {
            showLoader: (text = 'ประมวลผล...') => { document.getElementById('loader-text').innerText = text; document.getElementById('global-loader').classList.remove('hidden'); document.getElementById('global-loader').classList.add('flex'); },
            hideLoader: () => { document.getElementById('global-loader').classList.add('hidden'); document.getElementById('global-loader').classList.remove('flex'); },
            toast: (msg, type = 'success') => { const el = document.createElement('div'); const bg = type === 'error' ? 'bg-danger' : type === 'warning' ? 'bg-warning' : type === 'info' ? 'bg-blue-500' : 'bg-success'; el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg flex gap-3 pointer-events-auto transition-all animate-[fadeIn_.2s_ease-out]`; el.innerHTML = `<div>${type==='error'?'✕':'✓'}</div><div class="text-sm font-medium">${utils.esc(msg)}</div>`; document.getElementById('toast-container').appendChild(el); setTimeout(() => el.remove(), 3500); },
            openConfirm: (title, message, onCb) => { document.getElementById('confirm-title').innerText = title; document.getElementById('confirm-message').innerText = message; const m = document.getElementById('confirm-modal'); const b = document.getElementById('confirm-modal-box'); m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(() => b.classList.remove('scale-95'), 10); document.getElementById('confirm-action-btn').onclick = async () => { ui.closeConfirm(); if(onCb) await onCb(); }; },
            closeConfirm: () => { document.getElementById('confirm-modal-box').classList.add('scale-95'); setTimeout(() => { document.getElementById('confirm-modal').classList.add('hidden'); document.getElementById('confirm-modal').classList.remove('flex'); }, 150); },
            openModal: (title, html) => { document.getElementById('modal-title').innerText = title; document.getElementById('modal-content').innerHTML = html; const m = document.getElementById('general-modal'); m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(() => document.getElementById('general-modal-box').classList.remove('translate-y-full'), 10); },
            closeModal: () => { document.getElementById('general-modal-box').classList.add('translate-y-full'); setTimeout(() => { document.getElementById('general-modal').classList.add('hidden'); document.getElementById('general-modal').classList.remove('flex'); }, 300); },
            openSidebar: () => { document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebar-overlay').classList.remove('hidden'); },
            closeSidebar: () => { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.add('hidden'); }
        };

        async function rpc(fn, params = {}) { 
            try { 
                const { data, error } = await supabaseClient.rpc(fn, params); 
                if (error) throw new Error(error.message); 
                return data; 
            } catch (e) { 
                console.error("RPC Error:", fn, e); 
                throw e; 
            } 
        }

        const logger = (action, desc) => { rpc('custom_log_action', { p_session_token: state.sessionToken, p_action: action, p_description: desc }).catch(()=>{}); };

        const auth = {
            login: async (e) => { e.preventDefault(); ui.showLoader('เข้าสู่ระบบ...'); try { const data = await rpc("custom_login", { p_username: document.getElementById('login-username').value, p_password: document.getElementById('login-password').value }); if (!data?.success) throw new Error(data?.message || 'รหัสไม่ถูกต้อง'); state.sessionToken = data.session_token; state.user = data.user; localStorage.setItem("stips_session_token", state.sessionToken); logger('LOGIN', 'เข้าสู่ระบบสำเร็จ'); ui.toast('เข้าสู่ระบบสำเร็จ'); app.initUserUI(); app.navigate('dashboard'); } catch (e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); } },
            logout: async () => { ui.openConfirm('ออกจากระบบ', 'ยืนยันการออกจากระบบใช่หรือไม่?', async () => { ui.showLoader(); try { if(state.sessionToken) { logger('LOGOUT', 'ออกจากระบบ'); await rpc("custom_logout", { p_session_token: state.sessionToken }); } } catch(e){} localStorage.removeItem("stips_session_token"); state.sessionToken = null; state.user = null; document.getElementById('app-root').classList.add('hidden'); document.getElementById('login-root').classList.remove('hidden'); ui.hideLoader(); ui.toast('ออกจากระบบแล้ว'); handlers.loadLoginUsers(); handlers.loadLeaderboard(); }); },
            validate: async () => { if(!state.sessionToken) return false; try { const data = await rpc("custom_me", { p_session_token: state.sessionToken }); if(data?.success) { state.user = data.user; return true; } } catch(e) {} localStorage.removeItem("stips_session_token"); return false; }
        };

        const pages = {
            dashboard: async () => {
                ui.showLoader();
                try {
                    const pRes = await rpc("custom_get_projects", { p_session_token: state.sessionToken });
                    state.projects = pRes.data || [];
                    const years = [...new Set(state.projects.map(p => String(p.fiscal_year || 'ไม่ระบุ')))].sort((a,b) => b.localeCompare(a));
                    state.availableYears = years.length > 0 ? years : [String(new Date().getFullYear() + 543)];
                    if (!state.fiscalYear || !state.availableYears.includes(state.fiscalYear)) state.fiscalYear = state.availableYears[0];

                    window.rawDashboardData = state.projects.filter(p => String(p.fiscal_year || 'ไม่ระบุ') === state.fiscalYear).map((p, index) => {
                        const statNo = parseInt(p.current_status, 10);
                        let poAmt = 0, disbAmt = 0;
                        if(statNo >= 7) poAmt = p.budget_amount; 
                        if(statNo === 8) disbAmt = p.budget_amount * 0.45;

="text-red-500">*</span></label><input type="date" id="c_end" class="w-full border border-slate-200 p-3 rounded-xl outline-none focus:ring-2 focus:ring-primary transition"></div></div><div class="mb-5"><label class="block text-xs font-semibold mb-1.5 text-slate-600 uppercase tracking-wider">แนบไฟล์สัญญา (PDF) <span class="text-red-500">*</span></label><input type="file" id="c_file" accept=".pdf" class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 transition"></div><div id="inst_table" class="hidden mt-4 mb-5 border border-slate-200 rounded-2xl overflow-hidden shadow-sm"><table class="w-full text-sm bg-white text-left"><thead class="bg-slate-50 border-b border-slate-100"><tr><th class="p-3 font-semibold text-slate-600 text-center">งวดงาน</th><th class="p-3 font-semibold text-slate-600 text-right">ราคางวดงาน (บาท)</th><th class="p-3 font-semibold text-slate-600 text-right">ร้อยละ (%)</th></tr></thead><tbody id="inst_tbody" class="divide-y divide-slate-100"></tbody></table><p id="inst_err" class="text-xs text-danger p-3 hidden font-medium bg-red-50 text-center border-t border-red-100">⚠️ ยอดรวมค่างวดงานต้องเท่ากับราคาสัญญาพอดี</p></div><button id="btn_save_c" onclick="handlers.saveContract()" disabled class="bg-primary text-white px-6 py-3.5 rounded-xl text-sm font-medium opacity-50 cursor-not-allowed w-full transition shadow-md">บันทึกข้อมูลและไปสถานะที่ 8</button>`;

            updateStatus: async (nextStep, remarks = '') => { 
                try { 
                    ui.showLoader('กำลังบันทึกสถานะ...'); 
                    const pid = state.selectedProject.id; 
                    const res = await rpc('custom_update_project_status', { p_session_token: state.sessionToken, p_project_id: pid, p_next_step: parseInt(nextStep, 10), p_remarks: String(remarks) }); 
                    if (!res.success) throw new Error(res.message); 
                    logger('UPDATE_STATUS', `อัปเดตสถานะโครงการไปที่ ${nextStep}`); 
                    const p = state.projects.find(x => String(x.id) === String(pid)); 
                    if (p) p.current_status = parseInt(nextStep, 10); 
                    ui.toast('อัปเดตสถานะสำเร็จ', 'success'); 
                    app.navigate('workflow', pid); 
                } catch (err) { 
                    ui.toast(err.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่', 'error');

                    ui.hideLoader(); 
                } 
            },

            saveStep: async (step, fields) => { 
                let data = {}; 
                for(let f of fields) { 
                    const val = document.getElementById(f).value; 
                    if(!val) return ui.toast('กรอกข้อมูลไม่ครบ', 'warning'); 
                    data[f] = val; 
                } 
                await handlers.updateStatus(step+1, JSON.stringify(data)); 
            },

            saveStep3: async () => { 
                const s = document.getElementById('s3_s').value; 
                const e = document.getElementById('s3_e').value; 
                if(!s || !e) return ui.toast('กรอกวันที่ให้ครบ', 'warning'); 
                if(new Date(e) < new Date(s)) return ui.toast('วันสิ้นสุดต้องไม่ก่อน', 'error'); 
                await handlers.updateStatus(4, JSON.stringify({s3_s: s, s3_e: e})); 
            },

            getBase64: (file) => { 
                return new Promise((resolve, reject) => { 
                    const reader = new FileReader(); 
                    reader.readAsDataURL(file); 
                    reader.onload = () => { 
                        let encoded = reader.result.toString().replace(/^data:(.*,)?/, ''); 
                        if ((encoded.length % 4) > 0) encoded += '='.repeat(4 - (encoded.length % 4)); 
                        resolve(encoded); 
                    }; 
                    reader.onerror = error => reject(error); 
                }); 
            },

            toggleAppeal: () => { 
                const v = document.getElementById('appeal_opt').value; 
                document.getElementById('appeal_extra').classList[v==='3'?'remove':'add']('hidden'); 
                let btn = ''; 
                if(v==='1'||v==='5') btn = `<button onclick="handlers.doAppeal('save')" class="bg-primary text-white px-6 py-3.5 rounded-xl text-sm font-medium w-full shadow-md">บันทึกและไปสถานะที่ 7</button>`; 
                else if(v==='2'||v==='4') btn = `<button onclick="handlers.doAppeal('cancel')" class="bg-danger text-white px-6 py-3.5 rounded-xl text-sm font-medium w-full shadow-md">บันทึกและยกเลิกโครงการ</button>`; 
                else if(v==='3') btn = `<button onclick="handlers.doAppeal('hold')" class="bg-warning text-white px-6 py-3.5 rounded-xl text-sm font-medium w-full shadow-md">แนบหลักฐาน (ค้างสถานะเพื่อรอผล)</button>`; 
                document.getElementById('appeal_btn').innerHTML = btn; 
            },

            doAppeal: async (action) => { 
                ui.openConfirm('ยืนยันอุทธรณ์', 'บันทึกข้อมูลการอุทธรณ์', async () => { 
                    ui.showLoader('บันทึกอุทธรณ์ และอัปโหลดไฟล์...'); 
                    try { 
                        const pid = state.selectedProject.id; 
                        let fileLink = null; 
                        if(action === 'hold') { 
                            const file = document.getElementById('appeal_file')?.files[0]; 
                            if(file) { 
                                const base64Data = await handlers.getBase64(file); 
                                const scriptUrl = "https://script.google.com/macros/s/AKfycbyv5rQh_3Ew0D819QeXJt-5yT0dG2M_XkC4T1sJ7iWpP0j4f_Xm-FjS7tD5N3P2qD/exec"; 
                                const uploadRes = await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ filename: `appeal_${pid}_${Date.now()}.pdf`, mimeType: file.type, base64: base64Data }), headers: { "Content-Type": "text/plain;charset=utf-8" } }); 
                                const driveData = await uploadRes.json(); 
                                if(!driveData.success) throw new Error(driveData.error); 
                                fileLink = driveData.fileUrl; 
                            } 
                        } 
                        await supabaseClient.from('appeals').insert([{ project_id: pid, appeal_option: document.getElementById('appeal_opt').value, central_audit_document_path: fileLink }]); 
                        if(action === 'cancel') { 
                            await supabaseClient.from('projects').update({is_cancelled: true, cancellation_reason: 'ยกเลิกจากผลอุทธรณ์'}).eq('id', pid); 
                            ui.toast('ยกเลิกแล้ว', 'warning'); app.navigate('projects'); 
                        } else if(action === 'save') { 
                            await handlers.updateStatus(7, "ผ่านอุทธรณ์"); 
                        } else { 
                            ui.toast('บันทึกเรียบร้อย', 'info'); app.navigate('workflow', pid); 
                        } 
                    } catch(e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); } 
                }); 
            },

            genInst: () => { const c = Number(document.getElementById('inst_count').value); const t = document.getElementById('inst_tbody'); if(c===0) { document.getElementById('inst_table').classList.add('hidden'); handlers.calcInst(); return; } document.getElementById('inst_table').classList.remove('hidden'); let h = ''; for(let i=1;i<=c;i++) h += `<tr><td class="p-3 border-b text-center font-medium text-slate-500 bg-slate-50/50">งวด ${i}</td><td class="p-3 border-b"><input type="number" class="inst-inp w-full border border-slate-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-primary text-right font-medium text-blue-700 transition" oninput="handlers.calcInst()"></td><td class="p-3 border-b text-right inst-pct text-slate-400 font-mono text-xs">0.00%</td></tr>`; h += `<tr><td class="p-4 bg-slate-50 font-bold text-center text-slate-600">รวมทั้งหมด</td><td class="p-4 bg-slate-50 font-bold text-right text-lg text-slate-800" id="inst_sum">0.00</td><td class="p-4 bg-slate-50 font-bold text-right text-emerald-600 text-lg" id="inst_pct_sum">0.00%</td></tr>`; t.innerHTML = h; handlers.calcInst(); },
            calcInst: () => { const contAmt = Number(document.getElementById('contract_amt').value||0); let sum = 0; document.querySelectorAll('.inst-inp').forEach((inp, idx) => { const v = Number(inp.value||0); sum += v; document.querySelectorAll('.inst-pct')[idx].innerText = contAmt>0 ? ((v/contAmt)*100).toFixed(2)+'%' : '0.00%'; }); const btn = document.getElementById('btn_save_c'); if(!btn) return; if(document.getElementById('inst_sum')) { document.getElementById('inst_sum').innerText = utils.formatMoney(sum); document.getElementById('inst_pct_sum').innerText = contAmt>0 ? ((sum/contAmt)*100).toFixed(2)+'%' : '0.00%'; const valid = sum > 0 && Math.abs(sum - contAmt) < 0.01; btn.disabled = !valid; btn.className = valid ? "bg-primary text-white px-6 py-3.5 rounded-xl w-full text-sm font-medium shadow-lg shadow-blue-500/30 transition hover:bg-blue-700" : "bg-slate-300 text-slate-500 px-6 py-3.5 rounded-xl w-full text-sm font-medium opacity-70 cursor-not-allowed"; document.getElementById('inst_err').classList[valid?'add':'remove']('hidden'); } else { btn.disabled = true; } },
            saveContract: async () => { const f = document.getElementById('c_file')?.files[0]; if(!f) return ui.toast('กรุณาแนบไฟล์สัญญา PDF', 'warning'); if(f.type !== 'application/pdf') return ui.toast('รองรับไฟล์ PDF เท่านั้น', 'error'); ui.showLoader('กำลังอัปโหลดไฟล์ไปที่ Google Drive...'); try { const pid = state.selectedProject.id; const base64Data = await handlers.getBase64(f); const scriptUrl = "https://script.google.com/macros/s/AKfycbyv5rQh_3Ew0D819QeXJt-5yT0dG2M_XkC4T1sJ7iWpP0j4f_Xm-FjS7tD5N3P2qD/exec"; const uploadRes = await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ filename: `contract_${pid}_${Date.now()}.pdf`, mimeType: f.type, base64: base64Data }), headers: { "Content-Type": "text/plain;charset=utf-8" } }); const driveData = await uploadRes.json(); if(!driveData.success) throw new Error(driveData.error); const {data: cData, error:e2} = await supabaseClient.from('contracts').upsert({ project_id: pid, signed_amount: Number(document.getElementById('contract_amt').value), remaining_budget: Number(document.getElementById('remain_amt').value.replace(/,/g,'')), contract_signed_date: document.getElementById('c_start').value, contract_end_date: document.getElementById('c_end').value, installment_count: Number(document.getElementById('inst_count').value), contract_document_path: driveData.fileUrl }, { onConflict: 'project_id' }).select(); if(e2) throw e2; await supabaseClient.from('contract_installments').delete().eq('contract_id', cData[0].id); const instList = []; const contAmt = Number(document.getElementById('contract_amt').value); document.querySelectorAll('.inst-inp').forEach((inp, i) => { const v = Number(inp.value); instList.push({ contract_id: cData[0].id, installment_no: i+1, installment_amount: v, percentage: (v/contAmt)*100 }); }); const {error:e3} = await supabaseClient.from('contract_installments').insert(instList); if(e3) throw e3; await handlers.updateStatus(8, "ลงนามเรียบร้อย เริ่มบริหารสัญญา"); } catch(e) { ui.toast(e.message, 'error'); ui.hideLoader(); } },

            calcDisburseRow: (id, maxVal) => { const inp = document.getElementById(`paid_${id}`); let val = Number(inp.value || 0); if (val > maxVal) { ui.toast('เบิกจ่ายห้ามเกินยอดงวดงาน', 'warning'); val = maxVal; inp.value = maxVal; } document.getElementById(`pile_${id}`).innerText = utils.formatMoney(maxVal - val); let tPaid = 0; let tPile = 0; document.querySelectorAll('[id^="paid_"]').forEach(el => tPaid += Number(el.value || 0)); document.querySelectorAll('[id^="pile_"]').forEach(el => tPile += Number(el.innerText.replace(/,/g,'') || 0)); document.getElementById('total_paid').innerText = utils.formatMoney(tPaid); document.getElementById('total_pile').innerText = utils.formatMoney(tPile); },

            loadLeaderboard: async (year = null) => {
                try {
                    const res = await rpc('get_public_leaderboard', { p_year: year });
                    if(res && res.success) {
                        window.leaderboardData = res.data || [];
                        const yearSelect = document.getElementById('leaderboard-year');
                        if (yearSelect) {
                            if (res.years && res.years.length > 0) {
                                yearSelect.innerHTML = res.years.map(y => `<option class="text-slate-800" value="${y}" ${y === res.current_year ? 'selected' : ''}>ปีงบประมาณ ${y}</option>`).join('');
                            } else {
                                yearSelect.innerHTML = `<option class="text-slate-800" value="">ยังไม่มีข้อมูล</option>`;
                            }
                        }
                        handlers.renderLeaderboard();
                    } else {
                        document.getElementById('leaderboard-list').innerHTML = `<div class="text-center py-10 text-white/50">ยังไม่มีข้อมูลโครงการ</div>`;
                    }
                } catch(e) {
                    console.error("Leaderboard Error:", e);
                    const el = document.getElementById('leaderboard-list');
                    if (el) el.innerHTML = `<div class="text-center py-10 text-white/50">ไม่พบข้อมูลจัดอันดับในปีที่เลือก</div>`;
                }
            },
            switchLeaderboard: (tab) => {
                window.leaderboardTab = tab;
                document.getElementById('tab-best').className = tab === 'best' ? "flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-sm font-bold bg-white text-blue-900 shadow-sm transition" : "flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-sm font-bold text-white hover:bg-white/10 transition";
                document.getElementById('tab-worst').className = tab === 'worst' ? "flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-sm font-bold bg-white text-blue-900 shadow-sm transition" : "flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-sm font-bold text-white hover:bg-white/10 transition";
                handlers.renderLeaderboard();
            },
            renderLeaderboard: () => {
                const listEl = document.getElementById('leaderboard-list');
                if (!listEl) return;
                if (!window.leaderboardData || window.leaderboardData.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-10 text-white/50">ยังไม่มีข้อมูลโครงการในปีนี้</div>`;
                    return;
                }
                let sortedData = [...window.leaderboardData];
                if (window.leaderboardTab === 'worst') sortedData.reverse(); 
                const top100 = sortedData.slice(0, 100);

                let html = '';
                top100.forEach((item, idx) => {
