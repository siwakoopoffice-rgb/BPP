<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>STIPS - ระบบติดตามงบประมาณลงทุนวิทยาลัย</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { kanit: ['Kanit', 'sans-serif'] },
                    colors: {
                        primary: '#1d4ed8', // blue-700
                        success: '#15803d', // green-700
                        danger: '#b91c1c',  // red-700
                        warning: '#b45309', // amber-700
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased h-screen flex flex-col overflow-hidden">

    <!-- ==========================================
         UI CONTAINERS
    ========================================== -->
    <div id="app-root" class="w-full h-full flex flex-col md:flex-row hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 flex flex-col">
            <div class="p-4 border-b border-slate-200 flex items-center justify-between">
                <h1 class="text-2xl font-bold text-primary">STIPS</h1>
                <button onclick="ui.closeSidebar()" class="md:hidden text-2xl">&times;</button>
            </div>
            <div class="p-4 border-b border-slate-100">
                <p id="user-fullname" class="font-medium text-sm truncate"></p>
                <p id="user-role-badge" class="text-xs mt-1 inline-block px-2 py-0.5 bg-blue-100 text-blue-800 rounded-full"></p>
            </div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-1" id="main-nav">
                <button onclick="app.navigate('dashboard')" data-nav="dashboard" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg hover:bg-slate-100 text-left font-medium transition-colors">▣ แดชบอร์ด</button>
                <button onclick="app.navigate('projects')" data-nav="projects" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg hover:bg-slate-100 text-left font-medium transition-colors">▤ โครงการงบประมาณ</button>
                <button onclick="app.navigate('users')" data-nav="users" class="w-full items-center gap-3 px-3 py-2 text-sm rounded-lg hover:bg-slate-100 text-left font-medium transition-colors hidden">♙ จัดการผู้ใช้งาน</button>
            </nav>
            <div class="p-4 border-t border-slate-200">
                <button onclick="auth.logout()" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg hover:bg-red-50 text-red-600 text-left font-medium transition-colors">⇥ ออกจากระบบ</button>
            </div>
        </aside>
        <div id="sidebar-overlay" onclick="ui.closeSidebar()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden"></div>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden w-full relative">
            <header class="md:hidden flex items-center justify-between p-4 bg-white border-b border-slate-200 shrink-0">
                <h1 class="text-xl font-bold text-primary">STIPS</h1>
                <button onclick="ui.openSidebar()" class="p-1.5 text-2xl">☰</button>
            </header>
            <div id="page-container" class="flex-1 overflow-y-auto p-4 sm:p-6 pb-24"></div>
        </main>
    </div>

    <!-- Login Screen -->
    <div id="login-root" class="w-full h-full flex items-center justify-center bg-slate-100 p-4">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-primary mb-2">STIPS</h1>
                <p class="text-sm text-slate-500">ระบบติดตามงบประมาณลงทุนวิทยาลัย</p>
            </div>
            <form onsubmit="auth.login(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">ชื่อผู้ใช้งาน</label>
                    <input type="text" id="login-username" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">รหัสผ่าน</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary outline-none">
                </div>
                <button type="submit" class="w-full bg-primary text-white font-medium py-2.5 rounded-lg hover:bg-blue-800 transition shadow-md">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- Global UI -->
    <div id="global-loader" class="fixed inset-0 bg-slate-900/60 z-[9999] hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-4">
            <div class="w-6 h-6 border-4 border-slate-200 border-t-primary rounded-full animate-spin"></div>
            <span id="loader-text" class="text-sm font-medium">กำลังประมวลผล...</span>
        </div>
    </div>
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 w-full max-w-sm pointer-events-none"></div>

    <div id="general-modal" class="fixed inset-0 bg-slate-900/60 z-[9000] hidden items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm">
        <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[90vh] flex flex-col shadow-2xl transition-transform transform translate-y-full sm:translate-y-0" id="general-modal-box">
            <div class="flex items-center justify-between p-4 border-b border-slate-200 shrink-0">
                <h3 id="modal-title" class="text-lg font-bold">หัวข้อ</h3>
                <button onclick="ui.closeModal()" class="text-2xl text-slate-400 hover:text-slate-800">&times;</button>
            </div>
            <div id="modal-content" class="p-4 sm:p-6 overflow-y-auto no-scrollbar"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIG & SETUP
        // ==========================================
        const SUPABASE_URL = "https://jfkqxwkukotmjaeuttcs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hEoWELY_mQr3E-5ldGB4og_82jI5BY_";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const state = {
            sessionToken: localStorage.getItem("stips_session_token"),
            user: null,
            currentRoute: 'dashboard',
            projects: [],
            selectedProject: null
        };

        // ==========================================
        // 2. UTILS & UI HELPERS
        // ==========================================
        const utils = {
            esc: (str) => String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]),
            formatMoney: (num) => Number(num || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
            getStatusName: (s) => ({ 1: 'ยังไม่ดำเนินการ', 2: 'จัดทำร่าง TOR', 3: 'เผยแพร่ร่าง TOR', 4: 'ประกาศเชิญชวน', 5: 'ประกาศผู้ชนะ', 6: 'รอผลอุทธรณ์', 7: 'ลงนามสัญญา', 8: 'บริหารสัญญา' })[s] || 'ไม่ทราบ',
            getStatusColor: (s) => ({ 1: 'bg-slate-100 text-slate-700', 2: 'bg-blue-50 text-blue-700', 3: 'bg-indigo-50 text-indigo-700', 4: 'bg-purple-50 text-purple-700', 5: 'bg-amber-50 text-amber-700', 6: 'bg-orange-50 text-orange-700', 7: 'bg-emerald-50 text-emerald-700', 8: 'bg-green-100 text-green-800' })[s] || 'bg-slate-100'
        };

        const ui = {
            showLoader: (text = 'ประมวลผล...') => { document.getElementById('loader-text').innerText = text; document.getElementById('global-loader').classList.remove('hidden'); document.getElementById('global-loader').classList.add('flex'); },
            hideLoader: () => { document.getElementById('global-loader').classList.add('hidden'); document.getElementById('global-loader').classList.remove('flex'); },
            toast: (msg, type = 'success') => {
                const el = document.createElement('div');
                const bg = type === 'error' ? 'bg-danger' : type === 'warning' ? 'bg-warning' : 'bg-success';
                el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg flex gap-3 pointer-events-auto transition-all animate-[fadeIn_.2s_ease-out]`;
                el.innerHTML = `<div>${type==='error'?'✕':'✓'}</div><div>${utils.esc(msg)}</div>`;
                document.getElementById('toast-container').appendChild(el);
                setTimeout(() => el.remove(), 3000);
            },
            openModal: (title, html) => {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-content').innerHTML = html;
                const m = document.getElementById('general-modal');
                m.classList.remove('hidden'); m.classList.add('flex');
                setTimeout(() => document.getElementById('general-modal-box').classList.remove('translate-y-full'), 10);
            },
            closeModal: () => {
                document.getElementById('general-modal-box').classList.add('translate-y-full');
                setTimeout(() => { document.getElementById('general-modal').classList.add('hidden'); document.getElementById('general-modal').classList.remove('flex'); }, 300);
            },
            openSidebar: () => { document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebar-overlay').classList.remove('hidden'); },
            closeSidebar: () => { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.add('hidden'); }
        };

        async function rpc(fn, params = {}) {
            try {
                const { data, error } = await supabaseClient.rpc(fn, params);
                if (error) throw new Error(error.message);
                return data;
            } catch (e) { console.error(fn, e); throw e; }
        }

        // ==========================================
        // 3. AUTH LOGIC
        // ==========================================
        const auth = {
            login: async (e) => {
                e.preventDefault();
                ui.showLoader('เข้าสู่ระบบ...');
                try {
                    const data = await rpc("custom_login", {
                        p_username: document.getElementById('login-username').value,
                        p_password: document.getElementById('login-password').value
                    });
                    if (!data?.success) throw new Error(data?.message || 'รหัสไม่ถูกต้อง');
                    state.sessionToken = data.session_token;
                    state.user = data.user;
                    localStorage.setItem("stips_session_token", state.sessionToken);
                    ui.toast('เข้าสู่ระบบสำเร็จ');
                    app.initUserUI();
                    app.navigate('dashboard');
                } catch (e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); }
            },
            logout: async () => {
                ui.showLoader();
                try { if(state.sessionToken) await rpc("custom_logout", { p_session_token: state.sessionToken }); } catch(e){}
                localStorage.removeItem("stips_session_token");
                state.sessionToken = null; state.user = null;
                document.getElementById('app-root').classList.add('hidden');
                document.getElementById('login-root').classList.remove('hidden');
                ui.hideLoader();
                ui.toast('ออกจากระบบแล้ว');
            },
            validate: async () => {
                if(!state.sessionToken) return false;
                try {
                    const data = await rpc("custom_me", { p_session_token: state.sessionToken });
                    if(data?.success) { state.user = data.user; return true; }
                } catch(e) {}
                localStorage.removeItem("stips_session_token"); return false;
            }
        };

        // ==========================================
        // 4. PAGES (Dashboard, Projects)
        // ==========================================
        const pages = {
            dashboard: async () => {
                ui.showLoader();
                try {
                    const data = await rpc("custom_dashboard", { p_session_token: state.sessionToken });
                    const d = data.data;
                    document.getElementById('page-container').innerHTML = `
                        <h2 class="text-2xl font-bold mb-6">แดชบอร์ดภาพรวม</h2>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            <div class="bg-white p-4 rounded-xl border border-slate-200">
                                <p class="text-xs text-slate-500">โครงการทั้งหมด</p>
                                <h3 class="text-2xl font-bold text-primary">${d.total_projects}</h3>
                            </div>
                            <div class="bg-white p-4 rounded-xl border border-slate-200">
                                <p class="text-xs text-slate-500">งบประมาณรวม</p>
                                <h3 class="text-xl font-bold text-success">฿${utils.formatMoney(d.total_budget)}</h3>
                            </div>
                            <div class="bg-white p-4 rounded-xl border border-slate-200">
                                <p class="text-xs text-slate-500">งบก่อสร้าง</p>
                                <h3 class="text-lg font-bold">฿${utils.formatMoney(d.construction_budget)}</h3>
                            </div>
                            <div class="bg-white p-4 rounded-xl border border-slate-200">
                                <p class="text-xs text-slate-500">งบครุภัณฑ์</p>
                                <h3 class="text-lg font-bold">฿${utils.formatMoney(d.equipment_budget)}</h3>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200">
                            <h3 class="font-bold mb-4">จำนวนโครงการตามสถานะ (1-8)</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                ${[1,2,3,4,5,6,7,8].map(i => `
                                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border">
                                        <span class="text-xs text-slate-600">${i}. ${utils.getStatusName(i)}</span>
                                        <span class="font-bold w-6 h-6 bg-white rounded-full flex items-center justify-center shadow-sm">${d[`status_${i}`]}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } catch (e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); }
            },
            projects: async () => {
                ui.showLoader();
                try {
                    const data = await rpc("custom_get_projects", { p_session_token: state.sessionToken });
                    state.projects = data.data || [];
                    
                    let html = `
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-slate-800">รายการโครงการ</h2>
                            <button onclick="handlers.openCreateModal()" class="bg-primary text-white px-4 py-2 rounded-xl text-sm font-medium">+ สร้างโครงการ</button>
                        </div>
                    `;

                    if(state.projects.length === 0) {
                        html += `<div class="p-10 text-center bg-white border border-dashed rounded-xl">ไม่มีข้อมูลโครงการ</div>`;
                    } else {
                        html += `<div class="space-y-4">`;
                        state.projects.forEach(p => {
                            html += `
                                <div class="bg-white border rounded-xl p-4 flex flex-col md:flex-row justify-between md:items-center gap-4 hover:shadow-sm">
                                    <div>
                                        <span class="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-500">${p.project_code}</span>
                                        <h3 class="font-bold text-lg mt-1">${utils.esc(p.project_name)}</h3>
                                        <div class="flex gap-4 mt-2 text-sm">
                                            <span class="text-slate-500">งบ: <b class="text-blue-600">฿${utils.formatMoney(p.budget_amount)}</b></span>
                                            <span class="text-slate-500">ประเภท: <b>${p.project_type}</b></span>
                                        </div>
                                    </div>
                                    <div class="flex flex-col md:items-end gap-2">
                                        <span class="px-3 py-1 text-xs rounded-full border font-bold ${utils.getStatusColor(p.current_status)}">
                                            ${p.current_status}. ${utils.getStatusName(p.current_status)}
                                        </span>
                                        <button onclick="app.navigate('workflow', '${p.id}')" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-medium w-full md:w-auto">จัดการ Workflow →</button>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }
                    document.getElementById('page-container').innerHTML = html;
                } catch (e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); }
            },
            workflow: (projectId) => {
                const p = state.projects.find(x => x.id === projectId);
                if(!p) return app.navigate('projects');
                state.selectedProject = p;

                let html = `
                    <button onclick="app.navigate('projects')" class="text-blue-600 text-sm mb-4">← กลับรายการ</button>
                    <div class="bg-white p-5 rounded-2xl border mb-6 shadow-sm">
                        <h2 class="text-xl font-bold">${utils.esc(p.project_name)}</h2>
                        <p class="text-sm text-slate-500">รหัส: ${p.project_code} | สถานะปัจจุบัน: ขั้นที่ ${p.current_status}</p>
                    </div>
                    <div class="space-y-4">
                `;

                for(let i=1; i<=8; i++) {
                    const isDone = p.current_status > i;
                    const isCur = p.current_status === i;
                    const isWait = p.current_status < i;
                    const bg = isDone ? 'bg-emerald-50 border-emerald-200' : isCur ? 'bg-blue-50 border-blue-300 ring-2 ring-blue-100' : 'bg-slate-50 border-slate-200 opacity-50';
                    const icon = isDone ? '✓' : i;

                    html += `
                        <div class="flex gap-4">
                            <div class="flex flex-col items-center">
                                <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white ${isDone?'bg-success':isCur?'bg-primary':'bg-slate-300'}">${icon}</div>
                                ${i<8 ? `<div class="w-0.5 h-full min-h-[40px] ${isDone?'bg-success':'bg-slate-200'}"></div>` : ''}
                            </div>
                            <div class="flex-1 pb-6">
                                <div class="border rounded-xl p-4 ${bg}">
                                    <h3 class="font-bold text-slate-800">${i}. ${utils.getStatusName(i)}</h3>
                                    ${isCur ? handlers.renderStepForm(i, p) : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('page-container').innerHTML = html + `</div>`;
            }
        };

        // ==========================================
        // 5. WORKFLOW FORMS & HANDLERS
        // ==========================================
        const handlers = {
            openCreateModal: () => {
                ui.openModal('สร้างโครงการใหม่', `
                    <form onsubmit="handlers.submitCreate(event)" class="space-y-4">
                        <input name="code" required placeholder="รหัสโครงการ" class="w-full px-4 py-2 border rounded-xl outline-none">
                        <textarea name="name" required placeholder="ชื่อโครงการ" rows="2" class="w-full px-4 py-2 border rounded-xl outline-none"></textarea>
                        <select name="type" required class="w-full px-4 py-2 border rounded-xl outline-none bg-white">
                            <option value="">เลือกประเภท...</option><option value="ที่ดิน/สิ่งก่อสร้าง">ที่ดิน/สิ่งก่อสร้าง</option><option value="ครุภัณฑ์">ครุภัณฑ์</option>
                        </select>
                        <input name="budget" type="number" step="0.01" required placeholder="วงเงินงบประมาณ" class="w-full px-4 py-2 border rounded-xl outline-none">
                        <button type="submit" class="w-full bg-primary text-white py-3 rounded-xl font-medium">บันทึกโครงการ</button>
                    </form>
                `);
            },
            submitCreate: async (e) => {
                e.preventDefault(); ui.showLoader();
                try {
                    const fd = new FormData(e.target);
                    await rpc("custom_create_project", {
                        p_session_token: state.sessionToken, p_project_code: fd.get('code'), p_project_name: fd.get('name'), p_project_type: fd.get('type'), p_budget_amount: Number(fd.get('budget'))
                    });
                    ui.closeModal(); ui.toast('สร้างสำเร็จ'); app.navigate('projects');
                } catch(err) { ui.toast(err.message, 'error'); } finally { ui.hideLoader(); }
            },
            renderStepForm: (step, p) => {
                let f = `<div class="mt-4 pt-4 border-t border-slate-200/50">`;
                if(step === 1) f += `<button onclick="handlers.updateStatus(${step+1})" class="bg-primary text-white px-4 py-2 rounded-lg text-sm">เริ่มดำเนินการจัดทำ TOR</button>`;
                else if(step === 2) f += `วันที่เสร็จ: <input type="date" id="s2_d" class="border p-2 rounded mx-2"><button onclick="handlers.saveStep(${step}, ['s2_d'])" class="bg-primary text-white px-4 py-2 rounded-lg text-sm mt-2 sm:mt-0">บันทึกขั้นตอน</button>`;
                else if(step === 3) f += `เผยแพร่: <input type="date" id="s3_s" class="border p-2 rounded mr-2"> สิ้นสุด: <input type="date" id="s3_e" class="border p-2 rounded mr-2"><button onclick="handlers.saveStep(${step}, ['s3_s','s3_e'])" class="bg-primary text-white px-4 py-2 rounded-lg text-sm mt-2">บันทึกขั้นตอน</button>`;
                else if(step === 4) f += `ประกาศ: <input type="date" id="s4_d" class="border p-2 rounded mx-2"><button onclick="handlers.saveStep(${step}, ['s4_d'])" class="bg-primary text-white px-4 py-2 rounded-lg text-sm mt-2">บันทึกขั้นตอน</button>`;
                else if(step === 5) f += `ผู้ชนะ: <input type="text" id="s5_n" class="border p-2 rounded mx-2 w-48" placeholder="ชื่อบริษัท"> วันที่: <input type="date" id="s5_d" class="border p-2 rounded mx-2"><button onclick="handlers.saveStep(${step}, ['s5_n','s5_d'])" class="bg-primary text-white px-4 py-2 rounded-lg text-sm mt-2">บันทึกขั้นตอน</button>`;
                else if(step === 6) f += `
                    <select id="appeal_opt" onchange="handlers.toggleAppeal()" class="border p-2 rounded w-full sm:w-auto bg-white mb-2">
                        <option value="">-- เลือกผลอุทธรณ์ --</option><option value="1">ไม่มีการอุทธรณ์</option><option value="2">อุทธรณ์เห็นด้วย (ยกเลิก)</option><option value="3">อุทธรณ์ไม่เห็นด้วย (ส่งกรมบัญชีกลาง)</option><option value="5">ผลอุทธรณ์ไม่ขึ้น (ดำเนินการต่อ)</option>
                    </select>
                    <div id="appeal_extra" class="hidden mt-2 p-3 bg-white rounded border">
                        แนบไฟล์: <input type="file" id="appeal_file" accept=".pdf" class="text-sm">
                    </div>
                    <div id="appeal_btn" class="mt-3"></div>
                `;
                else if(step === 7) f += `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                        <div><label class="text-xs">ราคาสัญญา</label><input type="number" id="contract_amt" oninput="handlers.calcRemaining(${p.budget_amount})" class="w-full border p-2 rounded font-bold text-primary"></div>
                        <div><label class="text-xs">เงินเหลือจ่าย</label><input type="text" id="remain_amt" readonly class="w-full bg-slate-100 border p-2 rounded font-bold text-success"></div>
                        <div><label class="text-xs">เริ่ม</label><input type="date" id="c_start" class="w-full border p-2 rounded"></div>
                        <div><label class="text-xs">สิ้นสุด</label><input type="date" id="c_end" class="w-full border p-2 rounded"></div>
                    </div>
                    <div class="mb-3"><label class="text-xs">จำนวนงวดงาน</label>
                        <select id="inst_count" onchange="handlers.genInst()" class="w-full border p-2 rounded bg-white"><option value="0">เลือกงวด...</option>${Array.from({length:16},(_,i)=>`<option value="${i+1}">${i+1} งวด</option>`).join('')}</select>
                    </div>
                    <div class="mb-3"><label class="text-xs">ไฟล์สัญญา (PDF)</label><input type="file" id="c_file" accept=".pdf" class="w-full"></div>
                    <div id="inst_table" class="hidden mt-3 mb-3 border rounded overflow-hidden">
                        <table class="w-full text-sm bg-white"><tbody id="inst_tbody"></tbody></table>
                        <p id="inst_err" class="text-xs text-danger p-2 hidden">รวมค่างวดต้องเท่ากับราคาสัญญา</p>
                    </div>
                    <button id="btn_save_c" onclick="handlers.saveContract()" disabled class="bg-primary text-white px-5 py-2 rounded-lg opacity-50 cursor-not-allowed w-full">บันทึกการลงนามสัญญา</button>
                `;
                else if(step === 8) f += `<button class="bg-slate-900 text-white px-5 py-2.5 rounded-lg w-full">เข้าสู่ระบบบริหารสัญญาและการเบิกจ่าย</button>`;
                f += `</div>`; return f;
            },
            updateStatus: async (nextStep, remarks = '') => {
                const pid = state.selectedProject.id;
                await supabaseClient.from('projects').update({current_status: nextStep}).eq('id', pid);
                await supabaseClient.from('project_workflows').insert([{project_id: pid, status_no: nextStep, status_name: utils.getStatusName(nextStep), remarks: remarks, created_by: state.user.id}]);
                app.navigate('workflow', pid);
            },
            saveStep: async (step, fields) => {
                for(let f of fields) if(!document.getElementById(f).value) return ui.toast('กรอกข้อมูลไม่ครบ', 'warning');
                ui.showLoader();
                try { await handlers.updateStatus(step+1, 'Completed'); ui.toast('บันทึกสำเร็จ'); } catch(e){ ui.toast(e.message,'error'); } finally { ui.hideLoader(); }
            },
            toggleAppeal: () => {
                const v = document.getElementById('appeal_opt').value;
                document.getElementById('appeal_extra').classList[v==='3'?'remove':'add']('hidden');
                let btn = '';
                if(v==='1'||v==='5') btn = `<button onclick="handlers.doAppeal('save')" class="bg-primary text-white px-4 py-2 rounded">ผ่านไปขั้นที่ 7</button>`;
                else if(v==='2') btn = `<button onclick="handlers.doAppeal('cancel')" class="bg-danger text-white px-4 py-2 rounded">ยกเลิกโครงการ</button>`;
                else if(v==='3') btn = `<button onclick="handlers.doAppeal('hold')" class="bg-warning text-white px-4 py-2 rounded">แนบหลักฐานและรอพิจารณา</button>`;
                document.getElementById('appeal_btn').innerHTML = btn;
            },
            doAppeal: async (action) => {
                ui.showLoader('บันทึกอุทธรณ์...');
                try {
                    const pid = state.selectedProject.id;
                    let path = null;
                    if(action==='hold') {
                        const file = document.getElementById('appeal_file')?.files[0];
                        if(file) {
                            const {data, error} = await supabaseClient.storage.from('stips').upload(`appeals/${pid}/${Date.now()}.pdf`, file);
                            if(!error) path = data.path;
                        }
                    }
                    await supabaseClient.from('appeals').insert([{ project_id: pid, appeal_option: document.getElementById('appeal_opt').value, central_audit_document_path: path, created_by: state.user.id }]);
                    
                    if(action==='cancel') await supabaseClient.from('projects').update({is_cancelled: true, current_status: 6}).eq('id', pid);
                    else if(action==='save') await handlers.updateStatus(7, "ผ่านอุทธรณ์");
                    
                    ui.toast('บันทึกสำเร็จ'); app.navigate('workflow', pid);
                } catch(e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); }
            },
            calcRemaining: (budget) => {
                const amt = Number(document.getElementById('contract_amt').value||0);
                document.getElementById('remain_amt').value = utils.formatMoney(budget - amt);
                handlers.calcInst();
            },
            genInst: () => {
                const c = Number(document.getElementById('inst_count').value);
                const t = document.getElementById('inst_tbody');
                if(c===0) { document.getElementById('inst_table').classList.add('hidden'); return; }
                document.getElementById('inst_table').classList.remove('hidden');
                let h = '';
                for(let i=1;i<=c;i++) h += `<tr><td class="p-2 border-b">งวด ${i}</td><td class="p-2 border-b"><input type="number" class="inst-inp w-full border p-1" oninput="handlers.calcInst()"></td><td class="p-2 border-b text-right inst-pct">0%</td></tr>`;
                h += `<tr><td class="p-2 bg-slate-50 font-bold">รวม</td><td class="p-2 bg-slate-50 font-bold" id="inst_sum">0</td><td class="p-2 bg-slate-50 font-bold text-right text-primary" id="inst_pct_sum">0%</td></tr>`;
                t.innerHTML = h; handlers.calcInst();
            },
            calcInst: () => {
                const contAmt = Number(document.getElementById('contract_amt').value||0);
                let sum = 0;
                document.querySelectorAll('.inst-inp').forEach((inp, idx) => {
                    const v = Number(inp.value||0); sum += v;
                    document.querySelectorAll('.inst-pct')[idx].innerText = contAmt>0 ? ((v/contAmt)*100).toFixed(2)+'%' : '0%';
                });
                if(document.getElementById('inst_sum')) {
                    document.getElementById('inst_sum').innerText = sum;
                    document.getElementById('inst_pct_sum').innerText = contAmt>0 ? ((sum/contAmt)*100).toFixed(2)+'%' : '0%';
                    const valid = sum > 0 && Math.abs(sum - contAmt) < 0.01;
                    const btn = document.getElementById('btn_save_c');
                    btn.disabled = !valid;
                    btn.className = valid ? "bg-primary text-white px-5 py-2 rounded-lg w-full transition" : "bg-primary text-white px-5 py-2 rounded-lg opacity-50 cursor-not-allowed w-full";
                    document.getElementById('inst_err').classList[valid?'add':'remove']('hidden');
                }
            },
            saveContract: async () => {
                const f = document.getElementById('c_file')?.files[0];
                if(!f) return ui.toast('กรุณาแนบไฟล์สัญญา PDF', 'warning');
                ui.showLoader('บันทึกสัญญา...');
                try {
                    const pid = state.selectedProject.id;
                    const {data:upData} = await supabaseClient.storage.from('stips').upload(`contracts/${pid}/${Date.now()}.pdf`, f);
                    
                    const {data: cData, error} = await supabaseClient.from('contracts').insert([{
                        project_id: pid, signed_amount: Number(document.getElementById('contract_amt').value),
                        remaining_budget: Number(document.getElementById('remain_amt').value.replace(/,/g,'')),
                        contract_signed_date: document.getElementById('c_start').value,
                        contract_end_date: document.getElementById('c_end').value,
                        installment_count: Number(document.getElementById('inst_count').value),
                        contract_document_path: upData?.path, created_by: state.user.id
                    }]).select();
                    if(error) throw error;

                    const instList = [];
                    const contAmt = Number(document.getElementById('contract_amt').value);
                    document.querySelectorAll('.inst-inp').forEach((inp, i) => {
                        const v = Number(inp.value);
                        instList.push({ contract_id: cData[0].id, installment_no: i+1, installment_amount: v, percentage: (v/contAmt)*100 });
                    });
                    await supabaseClient.from('contract_installments').insert(instList);
                    await handlers.updateStatus(8, "ลงนามเรียบร้อย เริ่มบริหารสัญญา");
                    
                    ui.toast('ลงนามสัญญาสำเร็จ', 'success'); app.navigate('workflow', pid);
                } catch(e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); }
            }
        };

        // ==========================================
        // 6. MAIN APP ROUTER
        // ==========================================
        const app = {
            initUserUI: () => {
                document.getElementById('user-fullname').innerText = state.user.full_name;
                document.getElementById('user-role-badge').innerText = state.user.role === 'admin' ? 'Administrator' : 'Institution User';
                if(state.user.role === 'admin') document.getElementById('nav-users').classList.remove('hidden');
                document.getElementById('login-root').classList.add('hidden');
                document.getElementById('app-root').classList.remove('hidden');
            },
            navigate: (route, param = null) => {
                state.currentRoute = route;
                document.querySelectorAll('#main-nav button').forEach(b => {
                    b.classList.remove('bg-blue-50', 'text-primary');
                    if(b.dataset.nav === route || (route==='workflow' && b.dataset.nav==='projects')) {
                        b.classList.add('bg-blue-50', 'text-primary');
                    }
                });
                ui.closeSidebar();
                
                switch(route) {
                    case 'dashboard': pages.dashboard(); break;
                    case 'projects': pages.projects(); break;
                    case 'workflow': pages.workflow(param); break;
                    case 'users': 
                        if(state.user.role !== 'admin') {
                            document.getElementById('page-container').innerHTML = `<div class="p-10 text-center text-red-500 font-bold text-2xl">🔒 ไม่มีสิทธิ์เข้าถึง</div>`;
                        } else {
                            document.getElementById('page-container').innerHTML = `<div class="p-10 text-center">หน้าระบบจัดการ User สำหรับ Admin</div>`;
                        }
                        break;
                    default: pages.dashboard();
                }
            },
            init: async () => {
                ui.showLoader('เชื่อมต่อระบบ...');
                const isValid = await auth.validate();
                ui.hideLoader();
                if (isValid) {
                    app.initUserUI();
                    app.navigate('dashboard');
                } else {
                    document.getElementById('app-root').classList.add('hidden');
                    document.getElementById('login-root').classList.remove('hidden');
                }
            }
        };

        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
