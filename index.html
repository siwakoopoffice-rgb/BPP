<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>STIPS - ระบบติดตามงบประมาณลงทุนวิทยาลัย</title>

    <!-- Tailwind CSS (CDN) -->

    <!-- Google Fonts: Kanit -->

    <!-- Supabase JS Client (CDN) -->

                        warning: '#b45309', // amber-700

                }

        }
    </script>

    <!-- Custom CSS Base -->
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8fafc; /* slate-50 */

        }
        /* ซ่อน Scrollbar แต่อยู่ให้ Scroll ได้ */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="antialiased h-screen flex flex-col overflow-hidden">

    <!-- =========================
         UI LAYOUT ROOT
    ========================= -->
    <div id="app-root" class="w-full h-full flex flex-col md:flex-row hidden">
        
        <!-- Sidebar (Desktop) / Drawer (Mobile) -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col">
            <div class="p-4 border-b border-slate-200 flex items-center justify-between">
                <h1 class="text-2xl font-bold text-primary">STIPS</h1>
                <button onclick="ui.closeSidebar()" class="md:hidden text-slate-500 hover:text-slate-800 text-2xl">&times;</button>
            </div>
            
            <div class="p-4 border-b border-slate-100">
                <p id="user-fullname" class="font-medium text-sm truncate"></p>
                <p id="user-role-badge" class="text-xs mt-1 inline-block px-2 py-0.5 bg-blue-100 text-blue-800 rounded-full"></p>
            </div>

            <nav class="flex-1 overflow-y-auto p-4 space-y-1">
                <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg hover:bg-slate-100 text-left text-slate-700 font-medium transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    แดชบอร์ด
                </button>
                <button onclick="app.navigate('projects')" id="nav-projects" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg hover:bg-slate-100 text-left text-slate-700 font-medium transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    โครงการงบประมาณ
                </button>
                <!-- Admin Only Nav -->
                <button onclick="app.navigate('users')" id="nav-users" class="w-full items-center gap-3 px-3 py-2 text-sm rounded-lg hover:bg-slate-100 text-left text-slate-700 font-medium transition-colors hidden">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    จัดการผู้ใช้งาน
                </button>
            </nav>

            <div class="p-4 border-t border-slate-200">
                <button onclick="auth.logout()" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg hover:bg-red-50 text-red-600 text-left font-medium transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    ออกจากระบบ
                </button>
            </div>
        </aside>

        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" onclick="ui.closeSidebar()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden"></div>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full overflow-hidden w-full relative">
            <!-- Topbar (Mobile Only) -->
            <header class="md:hidden flex items-center justify-between p-4 bg-white border-b border-slate-200 shrink-0">
                <h1 class="text-xl font-bold text-primary">STIPS</h1>
                <button onclick="ui.openSidebar()" class="text-slate-600 hover:bg-slate-100 p-1.5 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </header>

            <!-- Dynamic Pages Container -->
            <div id="page-container" class="flex-1 overflow-y-auto p-4 sm:p-6 pb-24">
                <!-- เนื้อหาจะถูก Inject ตรงนี้ผ่าน JS -->
            </div>
        </main>
    </div>

    <!-- =========================
         LOGIN SCREEN
    ========================= -->
    <div id="login-root" class="w-full h-full flex items-center justify-center bg-slate-100 p-4">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-primary mb-2">STIPS</h1>
                <p class="text-sm text-slate-500">ระบบติดตามงบประมาณลงทุนวิทยาลัย</p>
            </div>
            <form onsubmit="auth.login(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้งาน (รหัสสถานศึกษา)</label>
                    <input type="text" id="login-username" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                </div>
                <button type="submit" class="w-full bg-primary text-white font-medium py-2.5 rounded-lg hover:bg-blue-800 transition-colors mt-2 shadow-md shadow-blue-500/30">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- =========================
         GLOBAL UI COMPONENTS
    ========================= -->
    
    <!-- Loading Spinner Overlay -->
    <div id="global-loader" class="fixed inset-0 bg-slate-900/60 z-[9999] hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-4">
            <svg class="animate-spin h-6 w-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="loader-text" class="text-sm font-medium text-slate-700">กำลังประมวลผล...</span>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 sm:translate-x-0 sm:left-auto sm:right-4 z-[9999] flex flex-col gap-2 w-full max-w-[90vw] sm:max-w-sm pointer-events-none"></div>

    <!-- Confirm Dialog Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 z-[9998] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl scale-95 transition-transform" id="confirm-modal-box">
            <div class="p-5 sm:p-6 text-center">
                <div id="confirm-icon" class="w-12 h-12 rounded-full bg-red-100 text-danger flex items-center justify-center mx-auto mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <h3 id="confirm-title" class="text-lg font-bold text-slate-900 mb-2">ยืนยันการดำเนินการ</h3>
                <p id="confirm-message" class="text-sm text-slate-500 mb-6">การดำเนินการนี้ไม่สามารถย้อนกลับได้</p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="ui.closeConfirm()" class="w-full py-2.5 rounded-xl font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors">ยกเลิก</button>
                    <button id="confirm-action-btn" class="w-full py-2.5 rounded-xl font-medium text-white bg-danger hover:bg-red-800 transition-colors shadow-sm">ยืนยัน</button>
                </div>
            </div>
        </div>
    </div>

    <!-- General Modal (Used for Forms like Create Project) -->
    <div id="general-modal" class="fixed inset-0 bg-slate-900/60 z-[9000] hidden items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm">
        <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[90vh] flex flex-col shadow-2xl transition-transform transform translate-y-full sm:translate-y-0" id="general-modal-box">
            <div class="flex items-center justify-between p-4 border-b border-slate-200 shrink-0">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">หัวข้อ Modal</h3>
                <button onclick="ui.closeModal()" class="text-slate-400 hover:bg-slate-100 rounded-full p-1.5 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modal-content" class="p-4 sm:p-6 overflow-y-auto no-scrollbar">
                <!-- เนื้อหาฟอร์มจะถูก Inject ตรงนี้ -->
            </div>
        </div>
    </div>


    <!-- =========================
         JAVASCRIPT LOGIC
    ========================= -->
    <script>
        /* =========================
           1. CONFIG & SUPABASE
        ========================= */
        const SUPABASE_URL = 'https://jfkqxwkukotmjaeuttcs.supabase.co'; // เปลี่ยนเป็นของคุณ
        const SUPABASE_ANON_KEY = 'sb_publishable_hEoWELY_mQr3E-5ldGB4og_82jI5BY_'; // เปลี่ยนเป็นของคุณ

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        /* =========================
           2. STATE MANAGEMENT
        ========================= */
        const state = {
            user: null, // เก็บข้อมูล Profile
            session: null, // เก็บ Auth Session
            currentRoute: 'dashboard',
            projects: [],
            dashboardStats: null,
            selectedProject: null // โครงการที่กำลังดู Workflow อยู่
        };

        /* =========================
           3. UI & UTILS
        ========================= */
        const utils = {
            formatMoney: (num) => Number(num).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
            formatDate: (dateString) => {
                if (!dateString) return '-';
                const date = new Date(dateString);
                return date.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
            },
            getStatusColor: (statusNo) => {
                const colors = {
                    1: 'bg-slate-100 text-slate-700 border-slate-200',
                    2: 'bg-blue-50 text-blue-700 border-blue-200',
                    3: 'bg-indigo-50 text-indigo-700 border-indigo-200',
                    4: 'bg-purple-50 text-purple-700 border-purple-200',
                    5: 'bg-amber-50 text-amber-700 border-amber-200',
                    6: 'bg-orange-50 text-orange-700 border-orange-200',
                    7: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                    8: 'bg-green-100 text-green-800 border-green-300'
                };
                return colors[statusNo] || colors[1];
            },
            getStatusName: (statusNo) => {
                const names = {
                    1: 'ยังไม่ดำเนินการ', 2: 'จัดทำร่าง TOR', 3: 'เผยแพร่ร่าง TOR',
                    4: 'ประกาศเชิญชวน', 5: 'ประกาศผู้ชนะ', 6: 'รอผลอุทธรณ์',
                    7: 'ลงนามสัญญา', 8: 'บริหารสัญญา'
                };
                return names[statusNo] || 'ไม่ทราบสถานะ';
            }
        };

        const ui = {
            showLoader: (text = 'กำลังประมวลผล...') => {
                document.getElementById('loader-text').innerText = text;
                document.getElementById('global-loader').classList.remove('hidden');
                document.getElementById('global-loader').classList.add('flex');
            },
            hideLoader: () => {
                document.getElementById('global-loader').classList.add('hidden');
                document.getElementById('global-loader').classList.remove('flex');
            },
            toast: (message, type = 'success') => {
                const container = document.getElementById('toast-container');
                const toastEl = document.createElement('div');
                
                let bgColor = type === 'success' ? 'bg-success' : type === 'error' ? 'bg-danger' : type === 'warning' ? 'bg-warning' : 'bg-primary';
                let icon = type === 'success' ? '✓' : type === 'error' ? '✕' : '⚠';

                toastEl.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-start gap-3 pointer-events-auto transform transition-all duration-300 translate-y-[-20px] opacity-0`;
                toastEl.innerHTML = `
                    <div class="font-bold shrink-0 mt-0.5">${icon}</div>
                    <div class="text-sm font-medium leading-relaxed">${message}</div>
                `;
                
                container.appendChild(toastEl);
                
                // Animate In
                setTimeout(() => {
                    toastEl.classList.remove('translate-y-[-20px]', 'opacity-0');
                    toastEl.classList.add('translate-y-0', 'opacity-100');
                }, 10);

                // Remove after 3.5s
                setTimeout(() => {
                    toastEl.classList.remove('translate-y-0', 'opacity-100');
                    toastEl.classList.add('translate-y-[-20px]', 'opacity-0');
                    setTimeout(() => toastEl.remove(), 300);
                }, 3500);
            },
            openConfirm: (title, message, onConfirmCallback) => {
                document.getElementById('confirm-title').innerText = title;
                document.getElementById('confirm-message').innerText = message;
                const modal = document.getElementById('confirm-modal');
                const box = document.getElementById('confirm-modal-box');
                
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => box.classList.remove('scale-95'), 10);

                const btn = document.getElementById('confirm-action-btn');
                btn.onclick = async () => {
                    ui.closeConfirm();
                    if(onConfirmCallback) await onConfirmCallback();
                };
            },
            closeConfirm: () => {
                document.getElementById('confirm-modal-box').classList.add('scale-95');
                setTimeout(() => {
                    document.getElementById('confirm-modal').classList.add('hidden');
                    document.getElementById('confirm-modal').classList.remove('flex');
                }, 150);
            },
            openModal: (title, htmlContent) => {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-content').innerHTML = htmlContent;
                const modal = document.getElementById('general-modal');
                const box = document.getElementById('general-modal-box');
                
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => {
                    box.classList.remove('translate-y-full', 'sm:scale-95');
                    box.classList.add('translate-y-0', 'sm:scale-100');
                }, 10);
            },
            closeModal: () => {
                const box = document.getElementById('general-modal-box');
                box.classList.remove('translate-y-0', 'sm:scale-100');
                box.classList.add('translate-y-full', 'sm:scale-95');
                setTimeout(() => {
                    document.getElementById('general-modal').classList.add('hidden');
                    document.getElementById('general-modal').classList.remove('flex');
                    document.getElementById('modal-content').innerHTML = '';
                }, 300);
            },
            openSidebar: () => {
                document.getElementById('sidebar').classList.remove('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.remove('hidden');
            },
            closeSidebar: () => {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.add('hidden');
            },
            emptyState: (message, buttonHtml = '') => {
                return `
                    <div class="flex flex-col items-center justify-center p-12 bg-white border border-slate-200 border-dashed rounded-2xl text-center">
                        <div class="w-16 h-16 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center mb-4">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        </div>
                        <h3 class="text-lg font-medium text-slate-900">${message}</h3>
                        ${buttonHtml ? `<div class="mt-6">${buttonHtml}</div>` : ''}
                    </div>
                `;
            }
        };

        /* =========================
           4. AUTHENTICATION
        ========================= */
        const auth = {
            init: async () => {
                ui.showLoader('กำลังเชื่อมต่อระบบ...');
                try {
                    // Get session from Supabase
                    const { data: { session }, error } = await supabaseClient.auth.getSession();
                    
                    if (error) throw error;
                    
                    if (session) {
                        state.session = session;
                        await auth.loadProfile(session.user.id);
                    } else {
                        app.showLogin();
                    }
                } catch (error) {
                    console.error("Auth Init Error:", error);
                    ui.toast('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ', 'error');
                    app.showLogin();
                } finally {
                    ui.hideLoader();
                }

                // Listen for Auth changes (Token Refresh, etc.)
                supabaseClient.auth.onAuthStateChange(async (event, session) => {
                    if (event === 'SIGNED_OUT') {
                        state.user = null;
                        state.session = null;
                        app.showLogin();
                    }
                });
            },
            loadProfile: async (userId) => {
                try {
                    // เนื่องจากใช้ auth.users ต้องผูกกับ public.profiles
                    const { data, error } = await supabaseClient
                        .from('profiles')
                        .select('*, institutions(institution_name)')
                        .eq('id', userId)
                        .single();
                        
                    if (error) throw error;
                    
                    if (!data.is_active) {
                        await supabaseClient.auth.signOut();
                        ui.toast('บัญชีของคุณถูกระงับการใช้งาน', 'error');
                        return;
                    }

                    state.user = data;
                    
                    // Update UI Info
                    document.getElementById('user-fullname').innerText = data.full_name;
                    document.getElementById('user-role-badge').innerText = data.role === 'admin' ? 'Administrator' : (data.institutions?.institution_name || 'วิทยาลัย');
                    
                    // Show Admin Menu if Admin
                    if(data.role === 'admin') {
                        document.getElementById('nav-users').classList.remove('hidden');
                        document.getElementById('nav-users').classList.add('flex');
                    }

                    app.showApp();
                    app.navigate('dashboard');

                } catch (error) {
                    console.error("Load Profile Error:", error);
                    ui.toast('ไม่สามารถโหลดข้อมูลผู้ใช้ได้', 'error');
                    await supabaseClient.auth.signOut();
                }
            },
            login: async (e) => {
                e.preventDefault();
                const emailOrUsername = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;

                ui.showLoader('กำลังเข้าสู่ระบบ...');
                try {
                    // สมมติว่า Supabase ใช้ Email ในการล็อคอิน
                    // หาก Requirement คือ รหัสสถานศึกษา (Username) คุณอาจต้องมี Edge Function ดึง Email จาก Username 
                    // หรือตั้งค่าให้ Username เป็น Email Format ตอนสร้าง User เช่น INS-001@stips.local
                    
                    // * เพื่อความง่ายในการทำ Prototype ด้วย Supabase Auth มาตรฐาน จะถือว่ากรอก Email ตรงๆ ก่อน *
                    let loginEmail = emailOrUsername;
                    if(!loginEmail.includes('@')) {
                         loginEmail = `${emailOrUsername}@stips.local`; // ทริคหลอก Supabase Auth
                    }

                    const { data, error } = await supabaseClient.auth.signInWithPassword({

            getDashboardStats: async () => {
                // ตัวอย่างการดึงข้อมูลและจำลองการนับ
                let query = supabaseClient.from('projects').select('budget_amount, current_status, project_type');
                
                if (state.user.role !== 'admin') {
                    query = query.eq('institution_id', state.user.institution_id);
                }

                const { data, error } = await query;
                if (error) throw error;

                const stats = {
                    totalProjects: data.length,
                    totalBudget: data.reduce((sum, p) => sum + Number(p.budget_amount), 0),
                    equipBudget: data.filter(p => p.project_type === 'ครุภัณฑ์').reduce((sum, p) => sum + Number(p.budget_amount), 0),
                    constBudget: data.filter(p => p.project_type === 'ที่ดิน/สิ่งก่อสร้าง').reduce((sum, p) => sum + Number(p.budget_amount), 0),
                    statusCounts: {}
                };

                // นับสถานะ 1-8
                for(let i=1; i<=8; i++) stats.statusCounts[i] = 0;
                data.forEach(p => stats.statusCounts[p.current_status]++);

                return stats;
            },
            getProjects: async () => {
                let query = supabaseClient.from('projects').select(`
                    id, project_code, project_name, project_type, budget_amount, current_status, created_at,
                    institutions(institution_name)
                `).order('created_at', { ascending: false });

                if (state.user.role !== 'admin') {
                    query = query.eq('institution_id', state.user.institution_id);
                }

                const { data, error } = await query;
                if (error) throw error;
                return data;
            },
            createProject: async (formData) => {
                const { data, error } = await supabaseClient.from('projects').insert([{
                    institution_id: state.user.role === 'admin' ? formData.get('institution_id') : state.user.institution_id,
                    project_code: formData.get('project_code'),
                    project_name: formData.get('project_name'),
                    project_type: formData.get('project_type'),
                    budget_amount: formData.get('budget_amount'),
                    created_by: state.user.id
                }]).select();

                if (error) throw error;
                
                // สร้างประวัติสถานะแรกทันที
                await supabaseClient.from('project_workflows').insert([{
                    project_id: data[0].id,
                    status_no: 1,
                    status_name: 'ยังไม่ดำเนินการ',
                    created_by: state.user.id
                }]);

                return data;

            workflow: async (projectId) => {
                // หน้านี้จำลองการดู Workflow แบบ Stepper

                if(!project) {
                    app.navigate('projects');
                    return;
                }

                state.selectedProject = project;

                let html = `
                    <div class="mb-6">

                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 mb-6">

                        </div>
                        
                        <div class="space-y-4">
                `;

                // Render 8 Steps
                for(let i=1; i<=8; i++) {

                    const isWaiting = project.current_status < i;
                    
                    let iconBg = isCompleted ? 'bg-success text-white border-success' : isCurrent ? 'bg-primary text-white border-primary ring-4 ring-blue-100' : 'bg-slate-100 text-slate-400 border-slate-200';

                    html += `

                                    <option value="1">ไม่มีการอุทธรณ์ (ไปสถานะ 7)</option>
                                    <option value="5">ผลอุทธรณ์ไม่ขึ้น (ไปสถานะ 7)</option>
                                    <option value="2">มีการอุทธรณ์ แล้วเห็นด้วย (สั่งยกเลิก)</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-slate-700 mb-1">หมายเหตุ</label>
                                <textarea name="remarks" rows="2" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none"></textarea>
                            </div>
                            <button type="submit" class="w-full bg-primary text-white font-medium py-2.5 rounded-xl hover:bg-blue-800 transition">
                                ดำเนินการตามผลอุทธรณ์
                            </button>
                        </form>
                    `;
                }

                ui.openModal(`อัปเดตสถานะ: ${utils.getStatusName(statusNo)}`, formHtml);
            },
            submitUpdateStatus: async (e, currentStatusNo) => {
                e.preventDefault();
                ui.showLoader('กำลังอัปเดตสถานะ...');
                try {
                    const formData = new FormData(e.target);
                    const remarks = formData.get('remarks');
                    
                    let nextStatus = currentStatusNo + 1;
                    let isCancelled = false;

                    // Handle Appeal Logic (Status 6)
                    if (currentStatusNo === 6) {
                        const appealOpt = formData.get('appeal_option');
                        if(appealOpt === '2') {
                            isCancelled = true; // สั่งยกเลิก
                            nextStatus = 6; // ค้างไว้ 6
                        }
                        
                        // บันทึกลงตาราง appeals ด้วย
                        await supabaseClient.from('appeals').insert([{
                            project_id: state.selectedProject.id,
                            appeal_option: appealOpt,
                            remarks: remarks,
                            created_by: state.user.id
                        }]);
                    }

                    if (isCancelled) {
                        // อัปเดตตารางโปรเจคให้ยกเลิก
                        await supabaseClient.from('projects').update({
                            is_cancelled: true,
                            cancellation_reason: remarks || 'ยกเลิกจากผลอุทธรณ์'
                        }).eq('id', state.selectedProject.id);
                        ui.toast('ยกเลิกโครงการสำเร็จ', 'warning');
                    } else {
                        // เลื่อนสถานะ
                        await supabaseClient.from('projects').update({
                            current_status: nextStatus
                        }).eq('id', state.selectedProject.id);

                        // เก็บ Log ลง workflows
                        await supabaseClient.from('project_workflows').insert([{
                            project_id: state.selectedProject.id,
                            status_no: nextStatus,
                            status_name: utils.getStatusName(nextStatus),
                            remarks: remarks,
                            created_by: state.user.id
                        }]);
                        ui.toast('อัปเดตสถานะสำเร็จ');
                    }

                    ui.closeModal();
                    // รีโหลดหน้า Workflow ใหม่
                    const updatedProjects = await api.getProjects();
                    state.projects = updatedProjects;
                    app.navigate('workflow', state.selectedProject.id);

                } catch (error) {
                    console.error(error);
                    ui.toast('เกิดข้อผิดพลาดในการอัปเดตสถานะ', 'error');
                } finally {
                    ui.hideLoader();
                }
            }
        };

        /* =========================
           8. ROUTER & APP INIT
        ========================= */
        const app = {
            showLogin: () => {
                document.getElementById('app-root').classList.add('hidden');
                document.getElementById('login-root').classList.remove('hidden');
                ui.closeSidebar();
            },
            showApp: () => {
                document.getElementById('login-root').classList.add('hidden');
                document.getElementById('app-root').classList.remove('hidden');
            },
            navigate: (route, param = null) => {
                state.currentRoute = route;
                
                // Update Active Menu
                document.querySelectorAll('aside nav button').forEach(btn => {
                    btn.classList.remove('bg-blue-50', 'text-primary');
                    btn.classList.add('text-slate-700', 'hover:bg-slate-100');
                });
                const activeBtn = document.getElementById(`nav-${route === 'workflow' ? 'projects' : route}`);
                if(activeBtn) {
                    activeBtn.classList.remove('text-slate-700', 'hover:bg-slate-100');
                    activeBtn.classList.add('bg-blue-50', 'text-primary');
                }

                // Render Content
                ui.closeSidebar();
                window.scrollTo(0,0);
                
                if (pages[route]) {
                    pages[route](param);
                } else {
                    document.getElementById('page-container').innerHTML = ui.emptyState('กำลังอยู่ระหว่างการพัฒนา');
                }
            },
            init: () => {
                // Initialize Application
                auth.init();
            }
        };

        // Start App on DOM Content Loaded
        document.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>
</html>
