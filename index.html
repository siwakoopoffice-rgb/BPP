<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>STIPS - ระบบติดตามงบประมาณลงทุนวิทยาลัย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { kanit: ['Kanit', 'sans-serif'] },
                    colors: { primary: '#2563eb', success: '#16a34a', danger: '#dc2626', warning: '#d97706' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-hover { transition: all 0.2s ease-in-out; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="antialiased h-screen flex flex-col overflow-hidden">

    <!-- UI CONTAINERS -->
    <div id="app-root" class="w-full h-full flex flex-col md:flex-row hidden">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 flex flex-col shadow-xl md:shadow-none">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-blue-50 to-white">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-primary text-white rounded-lg flex items-center justify-center font-bold text-lg">S</div>
                    <h1 class="text-2xl font-bold text-primary tracking-tight">STIPS</h1>
                </div>
                <button onclick="ui.closeSidebar()" class="md:hidden text-2xl text-slate-400">&times;</button>
            </div>
            <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                <p id="user-fullname" class="font-semibold text-sm truncate text-slate-800"></p>
                <p id="user-role-badge" class="text-[10px] mt-1.5 inline-block px-2.5 py-1 bg-white border border-slate-200 text-slate-600 rounded-md shadow-sm font-medium"></p>
            </div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-1.5" id="main-nav">
                <button onclick="app.navigate('dashboard')" data-nav="dashboard" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm rounded-xl hover:bg-slate-100 text-left font-medium transition-colors">▣ แดชบอร์ด</button>
                <button onclick="app.navigate('projects')" data-nav="projects" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm rounded-xl hover:bg-slate-100 text-left font-medium transition-colors">▤ โครงการงบประมาณ</button>
                <button onclick="app.navigate('profile')" data-nav="profile" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm rounded-xl hover:bg-slate-100 text-left font-medium transition-colors">⚙️ ตั้งค่าบัญชีผู้ใช้</button>
                <button id="nav-audit" onclick="app.navigate('audit')" data-nav="audit" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm rounded-xl hover:bg-slate-100 text-left font-medium transition-colors">◉ ประวัติการใช้งาน</button>
                
                <div id="nav-admin-section" class="hidden pt-4 pb-1">
                    <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">ผู้ดูแลระบบ</p>
                    <button id="nav-users" onclick="app.navigate('users')" data-nav="users" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm rounded-xl hover:bg-slate-100 text-left font-medium transition-colors">♙ จัดการผู้ใช้งาน</button>
                </div>
            </nav>
            <div class="p-4 border-t border-slate-100 bg-slate-50/50">
                <button onclick="auth.logout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm rounded-xl hover:bg-red-50 text-red-600 text-left font-medium transition-colors shadow-sm bg-white border border-red-100">⇥ ออกจากระบบ</button>
            </div>
        </aside>
        <div id="sidebar-overlay" onclick="ui.closeSidebar()" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

        <main class="flex-1 flex flex-col h-full overflow-hidden w-full relative bg-slate-50">
            <header class="md:hidden flex items-center justify-between p-4 bg-white border-b border-slate-200 shrink-0 shadow-sm z-30">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 bg-primary text-white rounded-md flex items-center justify-center font-bold text-xs">S</div>
                    <h1 class="text-xl font-bold text-slate-800">STIPS</h1>
                </div>
                <button onclick="ui.openSidebar()" class="p-1.5 text-2xl text-slate-600">☰</button>
            </header>
            <div id="page-container" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 pb-24"></div>
        </main>
    </div>

    <!-- Login Screen -->
    <div id="login-root" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 p-4">
        <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-2xl w-full max-w-sm border border-white">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-primary text-white rounded-2xl flex items-center justify-center font-bold text-3xl mx-auto mb-4 shadow-lg shadow-blue-500/30">S</div>
                <h1 class="text-2xl font-bold text-slate-800">STIPS</h1>
                <p class="text-xs text-slate-500 mt-1 uppercase tracking-widest">ระบบติดตามงบประมาณลงทุน</p>
            </div>
            <form onsubmit="auth.login(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">สถานศึกษา / ผู้ใช้งาน (Username)</label>
                    <select id="login-username" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none transition-all font-medium text-slate-700">
                        <option value="">กำลังโหลดรายชื่อ...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">รหัสผ่าน</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary outline-none transition-all">
                </div>
                <button type="submit" class="w-full bg-primary text-white font-medium py-3 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-500/30 mt-2">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- Global Components (Loaders & Modals) -->
    <div id="global-loader" class="fixed inset-0 bg-slate-900/40 z-[9999] hidden items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white px-6 py-5 rounded-2xl shadow-2xl flex items-center gap-4 border border-slate-100">
            <div class="w-6 h-6 border-4 border-slate-100 border-t-primary rounded-full animate-spin"></div>
            <span id="loader-text" class="text-sm font-semibold text-slate-700">กำลังประมวลผล...</span>
        </div>
    </div>
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 w-full max-w-sm pointer-events-none"></div>
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 z-[9998] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl scale-95 transition-transform" id="confirm-modal-box">
            <div class="p-6 text-center">
                <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">!</div>
                <h3 id="confirm-title" class="text-xl font-bold text-slate-900 mb-2">ยืนยัน</h3>
                <p id="confirm-message" class="text-sm text-slate-500 mb-8 px-2"></p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="ui.closeConfirm()" class="w-full py-3 rounded-xl font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors">ยกเลิก</button>
                    <button id="confirm-action-btn" class="w-full py-3 rounded-xl font-medium text-white bg-danger hover:bg-red-700 shadow-md">ยืนยัน</button>
                </div>
            </div>
        </div>
    </div>
    <div id="general-modal" class="fixed inset-0 bg-slate-900/50 z-[9000] hidden items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full sm:max-w-xl max-h-[90vh] flex flex-col shadow-2xl transition-transform transform translate-y-full sm:translate-y-0" id="general-modal-box">
            <div class="flex items-center justify-between p-5 border-b border-slate-100 shrink-0 bg-slate-50/50 rounded-t-3xl">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">หัวข้อ</h3>
                <button onclick="ui.closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-200 text-slate-500 hover:bg-slate-300 transition-colors">&times;</button>
            </div>
            <div id="modal-content" class="p-5 sm:p-6 overflow-y-auto no-scrollbar"></div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = "https://jfkqxwkukotmjaeuttcs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hEoWELY_mQr3E-5ldGB4og_82jI5BY_";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const state = {
            sessionToken: localStorage.getItem("stips_session_token"),
            user: null, currentRoute: 'dashboard', 
            projects: [], selectedProject: null, users: [],
            projectPage: 1, projectLimit: 10, 
            auditPage: 1, auditLimit: 30, auditStartDate: '', auditEndDate: ''
        };

        const utils = {
            esc: (str) => String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]),
            formatMoney: (num) => Number(num || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
            formatDate: (dt) => {
                if(!dt) return '-'; const d = new Date(dt); 
                return d.toLocaleDateString('th-TH', {year:'numeric',month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
            },
            getStatusName: (s) => ({ 1: 'ยังไม่ดำเนินการ', 2: 'จัดทำร่าง TOR', 3: 'เผยแพร่ร่าง TOR', 4: 'ประกาศเชิญชวน', 5: 'ประกาศผู้ชนะ', 6: 'รอผลอุทธรณ์', 7: 'ลงนามสัญญา', 8: 'บริหารสัญญา' })[s] || 'ไม่ทราบ',
            getStatusColor: (s) => ({ 1: 'bg-slate-100 text-slate-700 border-slate-200', 2: 'bg-blue-50 text-blue-700 border-blue-200', 3: 'bg-indigo-50 text-indigo-700 border-indigo-200', 4: 'bg-purple-50 text-purple-700 border-purple-200', 5: 'bg-amber-50 text-amber-700 border-amber-200', 6: 'bg-orange-50 text-orange-700 border-orange-200', 7: 'bg-emerald-50 text-emerald-700 border-emerald-200', 8: 'bg-green-100 text-green-800 border-green-200' })[s] || 'bg-slate-100'
        };

        const ui = {
            showLoader: (text = 'ประมวลผล...') => { document.getElementById('loader-text').innerText = text; document.getElementById('global-loader').classList.remove('hidden'); document.getElementById('global-loader').classList.add('flex'); },
            hideLoader: () => { document.getElementById('global-loader').classList.add('hidden'); document.getElementById('global-loader').classList.remove('flex'); },
            toast: (msg, type = 'success') => {
                const el = document.createElement('div');
                const bg = type === 'error' ? 'bg-danger' : type === 'warning' ? 'bg-warning' : type === 'info' ? 'bg-blue-500' : 'bg-success';
                el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg flex gap-3 pointer-events-auto transition-all animate-[fadeIn_.2s_ease-out]`;
                el.innerHTML = `<div>${type==='error'?'✕':'✓'}</div><div class="text-sm font-medium">${utils.esc(msg)}</div>`;
                document.getElementById('toast-container').appendChild(el); setTimeout(() => el.remove(), 3500);
            },
            openConfirm: (title, message, onCb) => {
                document.getElementById('confirm-title').innerText = title; document.getElementById('confirm-message').innerText = message;
                const m = document.getElementById('confirm-modal'); const b = document.getElementById('confirm-modal-box');
                m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(() => b.classList.remove('scale-95'), 10);
                document.getElementById('confirm-action-btn').onclick = async () => { ui.closeConfirm(); if(onCb) await onCb(); };
            },
            closeConfirm: () => { document.getElementById('confirm-modal-box').classList.add('scale-95'); setTimeout(() => { document.getElementById('confirm-modal').classList.add('hidden'); document.getElementById('confirm-modal').classList.remove('flex'); }, 150); },
            openModal: (title, html) => {
                document.getElementById('modal-title').innerText = title; document.getElementById('modal-content').innerHTML = html;
                const m = document.getElementById('general-modal'); m.classList.remove('hidden'); m.classList.add('flex');
                setTimeout(() => document.getElementById('general-modal-box').classList.remove('translate-y-full'), 10);
            },
            closeModal: () => { document.getElementById('general-modal-box').classList.add('translate-y-full'); setTimeout(() => { document.getElementById('general-modal').classList.add('hidden'); document.getElementById('general-modal').classList.remove('flex'); }, 300); },
            openSidebar: () => { document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebar-overlay').classList.remove('hidden'); },
            closeSidebar: () => { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.add('hidden'); }
        };

        async function rpc(fn, params = {}) {
            try { const { data, error } = await supabaseClient.rpc(fn, params); if (error) throw new Error(error.message); return data; } 
            catch (e) { console.error(fn, e); throw e; }
        }

        const logger = (action, desc) => { rpc('custom_log_action', { p_session_token: state.sessionToken, p_action: action, p_description: desc }).catch(()=>{}); };

        const auth = {
            login: async (e) => {
                e.preventDefault(); ui.showLoader('เข้าสู่ระบบ...');
                try {
                    const data = await rpc("custom_login", { p_username: document.getElementById('login-username').value, p_password: document.getElementById('login-password').value });
                    if (!data?.success) throw new Error(data?.message || 'รหัสไม่ถูกต้อง');
                    state.sessionToken = data.session_token; state.user = data.user;
                    localStorage.setItem("stips_session_token", state.sessionToken); 
                    logger('LOGIN', 'เข้าสู่ระบบสำเร็จ'); ui.toast('เข้าสู่ระบบสำเร็จ');
                    app.initUserUI(); app.navigate('dashboard');
                } catch (e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); }
            },
            logout: async () => {
                ui.openConfirm('ออกจากระบบ', 'ยืนยันการออกจากระบบใช่หรือไม่?', async () => {
                    ui.showLoader();
                    try { if(state.sessionToken) { logger('LOGOUT', 'ออกจากระบบ'); await rpc("custom_logout", { p_session_token: state.sessionToken }); } } catch(e){}
                    localStorage.removeItem("stips_session_token"); state.sessionToken = null; state.user = null;
                    document.getElementById('app-root').classList.add('hidden'); document.getElementById('login-root').classList.remove('hidden');
                    ui.hideLoader(); ui.toast('ออกจากระบบแล้ว');
                    handlers.loadLoginUsers(); // รีโหลด Dropdown ใหม่
                });
            },
            validate: async () => {
                if(!state.sessionToken) return false;
                try { const data = await rpc("custom_me", { p_session_token: state.sessionToken }); if(data?.success) { state.user = data.user; return true; } } catch(e) {}
                localStorage.removeItem("stips_session_token"); return false;
            }
        };

        const pages = {
            dashboard: async () => {
                ui.showLoader();
                try {
                    const [dRes, logsRes] = await Promise.all([
                        rpc("custom_dashboard", { p_session_token: state.sessionToken }),
                        rpc("custom_get_dashboard_logs", { p_session_token: state.sessionToken })
                    ]);
                    const d = dRes.data; const logs = logsRes.data || [];
                    const scriptUrl = "https://script.google.com/macros/s/AKfycbytE8z0HDEeWinuMXoatf_W9Bb-LRU2QRKc4AUQp4qhngO-GaVVsh2KPwhznCsFU0XAcw/exec";
                    
                    document.getElementById('page-container').innerHTML = `
                        <h2 class="text-2xl font-bold mb-6 text-slate-800 tracking-tight">แดชบอร์ดภาพรวม</h2>
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 mb-8">
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 card-hover"><p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">โครงการทั้งหมด</p><h3 class="text-3xl font-bold text-primary">${d.total_projects}</h3></div>
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 card-hover"><p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">งบประมาณรวม</p><h3 class="text-2xl font-bold text-success truncate">฿${utils.formatMoney(d.total_budget)}</h3></div>
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 card-hover"><p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">งบก่อสร้าง</p><h3 class="text-xl font-bold text-slate-800 truncate">฿${utils.formatMoney(d.construction_budget)}</h3></div>
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 card-hover"><p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">งบครุภัณฑ์</p><h3 class="text-xl font-bold text-slate-800 truncate">฿${utils.formatMoney(d.equipment_budget)}</h3></div>
                        </div>
                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-8">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
                                <h3 class="font-bold text-lg text-slate-800 mb-5">จำนวนโครงการแบ่งตามสถานะ</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    ${[1,2,3,4,5,6,7,8].map(i => `<div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-100 card-hover"><span class="text-sm font-medium text-slate-600">${i}. ${utils.getStatusName(i)}</span><span class="font-bold w-8 h-8 bg-white rounded-lg flex items-center justify-center shadow-sm text-primary">${d[`status_${i}`]}</span></div>`).join('')}
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
                                <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2"><span class="text-xl">⏱️</span> ประวัติการใช้งานล่าสุด</h3>
                                <div class="space-y-4">
                                    ${logs.length === 0 ? '<p class="text-sm text-slate-500 text-center py-4 bg-slate-50 rounded-xl border border-dashed">ยังไม่มีประวัติการใช้งาน</p>' : logs.map(l => `
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between py-3 border-b border-slate-50 last:border-0 gap-2">
                                            <div>
                                                <p class="text-sm font-semibold text-slate-800">${utils.esc(l.description)}</p>
                                                <p class="text-xs text-slate-500 mt-1">โดย: <span class="font-medium text-primary">${utils.esc(l.full_name || 'วิทยาลัย')}</span> | <span class="bg-slate-100 px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider">${utils.esc(l.action)}</span></p>
                                            </div>
                                            <span class="text-xs font-mono text-slate-400 whitespace-nowrap">${utils.formatDate(l.created_at)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- รายงาน App Script -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-4">
                            <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2"><span class="text-xl">📊</span> รายงานและสถิติเชิงลึก (App Script)</h3>
                            <div class="w-full border border-slate-200 rounded-xl overflow-hidden relative" style="min-height: 70vh;">
                                <div class="absolute inset-0 flex items-center justify-center bg-slate-50 z-0">
                                    <div class="text-slate-400 text-sm flex flex-col items-center gap-2"><div class="w-6 h-6 border-2 border-slate-300 border-t-primary rounded-full animate-spin"></div>กำลังโหลดข้อมูล...</div>
                                </div>
                                <iframe src="${scriptUrl}" class="w-full h-full min-h-[70vh] border-0 relative z-10 bg-transparent"></iframe>
                            </div>
                        </div>
                    `;
                } catch (e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); }
            },
            
            projects: async (isPagination = false) => {
                if(!isPagination) {
                    ui.showLoader();
                    try {
                        const data = await rpc("custom_get_projects", { p_session_token: state.sessionToken });
                        state.projects = data.data || []; state.projectPage = 1;
                    } catch (e) { ui.toast(e.message, 'error'); ui.hideLoader(); return; }
                }
                const totalItems = state.projects.length; const totalPages = Math.ceil(totalItems / state.projectLimit) || 1;
                const startIdx = (state.projectPage - 1) * state.projectLimit; const displayProjects = state.projects.slice(startIdx, startIdx + state.projectLimit);

                let html = `

            },

            // คงฟังก์ชันเก่าไว้ทั้งหมด
            openCreateModal: () => { ui.openModal('สร้างโครงการใหม่', `<form onsubmit="handlers.submitCreate(event)" class="space-y-5 p-1"><div><label class="block text-sm font-semibold mb-1.5">รหัสโครงการ <span class="text-red-500">*</span></label><input name="code" required placeholder="เช่น PRJ-001" class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-primary transition"></div><div><label class="block text-sm font-semibold mb-1.5">ชื่อโครงการ (รายการ) <span class="text-red-500">*</span></label><textarea name="name" required placeholder="ระบุชื่อโครงการ..." rows="2" class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-primary transition"></textarea></div><div><label class="block text-sm font-semibold mb-1.5">ประเภท <span class="text-red-500">*</span></label><select name="type" required class="w-full px-4 py-2.5 border rounded-xl outline-none bg-white focus:ring-2 focus:ring-primary transition"><option value="">เลือกประเภท...</option><option value="ที่ดิน/สิ่งก่อสร้าง">ที่ดิน/สิ่งก่อสร้าง</option><option value="ครุภัณฑ์">ครุภัณฑ์</option></select></div><div><label class="block text-sm font-semibold mb-1.5">งบตาม พรบ. (บาท) <span class="text-red-500">*</span></label><input name="budget" type="number" min="0" step="0.01" required placeholder="0.00" class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-primary transition"></div><button type="submit" class="w-full bg-primary text-white py-3.5 rounded-xl font-medium hover:bg-blue-700 shadow-md transition">บันทึกและสร้างโครงการ (สถานะ 1)</button></form>`); },
            submitCreate: async (e) => { e.preventDefault(); ui.showLoader('สร้างโครงการ...'); try { const fd = new FormData(e.target); const pCode = fd.get('code'); const pName = fd.get('name'); await rpc("custom_create_project", { p_session_token: state.sessionToken, p_project_code: pCode, p_project_name: pName, p_project_type: fd.get('type'), p_budget_amount: Number(fd.get('budget')) }); logger('CREATE_PROJECT', `สร้างโครงการ [${pCode}] ${pName}`); ui.closeModal(); ui.toast('สร้างโครงการสำเร็จ'); app.navigate('projects'); } catch(err) { ui.toast(err.message, 'error'); } finally { ui.hideLoader(); } },
            updateStatus: async (nextStep, remarks = '') => { const pid = state.selectedProject.id; await supabaseClient.from('projects').update({current_status: nextStep}).eq('id', pid); await supabaseClient.from('project_workflows').insert([{project_id: pid, status_no: nextStep, status_name: utils.getStatusName(nextStep), remarks: remarks, created_by: state.user.id}]); logger('UPDATE_STATUS', `อัปเดตสถานะ ${nextStep}`); const p = state.projects.find(x => x.id === pid); if (p) p.current_status = nextStep; app.navigate('workflow', pid); },
            revertStatus: async (step) => { ui.openConfirm('ย้อนกลับมาแก้ไข', `ต้องการย้อนไปที่สถานะ ${step} ใช่หรือไม่?`, async () => { ui.showLoader(); try { await rpc('custom_revert_status', { p_session_token: state.sessionToken, p_project_id: state.selectedProject.id, p_target_status: step }); ui.toast('สำเร็จ', 'success'); const p = state.projects.find(x => x.id === state.selectedProject.id); if (p) p.current_status = step; app.navigate('workflow', state.selectedProject.id); } catch(e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); } }); },
            saveStep: async (step, fields) => { let data = {}; for(let f of fields) { const val = document.getElementById(f).value; if(!val) return ui.toast('กรอกข้อมูลไม่ครบ', 'warning'); data[f] = val; } ui.showLoader(); try { await handlers.updateStatus(step+1, JSON.stringify(data)); ui.toast('บันทึกสำเร็จ'); } catch(e){ ui.toast(e.message,'error'); } finally { ui.hideLoader(); } },
            saveStep3: async () => { const s = document.getElementById('s3_s').value; const e = document.getElementById('s3_e').value; if(!s || !e) return ui.toast('กรอกวันที่ให้ครบ', 'warning'); if(new Date(e) < new Date(s)) return ui.toast('วันสิ้นสุดต้องไม่ก่อน', 'error'); ui.showLoader(); try { await handlers.updateStatus(4, `เริ่ม: ${s}, สิ้นสุด: ${e}`); ui.toast('บันทึกสำเร็จ'); } catch(err){ ui.toast(err.message,'error'); } finally { ui.hideLoader(); } },
            toggleAppeal: () => { const v = document.getElementById('appeal_opt').value; document.getElementById('appeal_extra').classList[v==='3'?'remove':'add']('hidden'); let btn = ''; if(v==='1'||v==='5') btn = `<button onclick="handlers.doAppeal('save')" class="bg-primary text-white px-6 py-3 rounded-xl text-sm font-medium w-full shadow-md">บันทึกและไปสถานะที่ 7</button>`; else if(v==='2'||v==='4') btn = `<button onclick="handlers.doAppeal('cancel')" class="bg-danger text-white px-6 py-3 rounded-xl text-sm font-medium w-full shadow-md">บันทึกและยกเลิกโครงการ</button>`; else if(v==='3') btn = `<button onclick="handlers.doAppeal('hold')" class="bg-warning text-white px-6 py-3 rounded-xl text-sm font-medium w-full shadow-md">แนบหลักฐาน (ค้างสถานะเพื่อรอผล)</button>`; document.getElementById('appeal_btn').innerHTML = btn; },
            doAppeal: async (action) => { ui.openConfirm('ยืนยันอุทธรณ์', 'บันทึกข้อมูลการอุทธรณ์', async () => { ui.showLoader(); try { const pid = state.selectedProject.id; let path = null; if(action==='hold') { const file = document.getElementById('appeal_file')?.files[0]; if(file) { const {data, error} = await supabaseClient.storage.from('stips').upload(`appeals/${pid}/${Date.now()}.pdf`, file); if(!error) path = data.path; } } await supabaseClient.from('appeals').insert([{ project_id: pid, appeal_option: document.getElementById('appeal_opt').value, central_audit_document_path: path }]); if(action==='cancel') { await supabaseClient.from('projects').update({is_cancelled: true, cancellation_reason: 'ยกเลิกจากผลอุทธรณ์'}).eq('id', pid); ui.toast('ยกเลิกแล้ว', 'warning'); app.navigate('projects'); } else if(action==='save') { await handlers.updateStatus(7, "ผ่านอุทธรณ์"); ui.toast('สำเร็จ', 'success'); } else { ui.toast('บันทึกเรียบร้อย', 'info'); app.navigate('workflow', pid); } } catch(e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); } }); },
            calcRemaining: (budget) => { const amt = Number(document.getElementById('contract_amt').value||0); document.getElementById('remain_amt').value = utils.formatMoney(budget - amt); handlers.calcInst(); },
            genInst: () => { const c = Number(document.getElementById('inst_count').value); const t = document.getElementById('inst_tbody'); if(c===0) { document.getElementById('inst_table').classList.add('hidden'); handlers.calcInst(); return; } document.getElementById('inst_table').classList.remove('hidden'); let h = ''; for(let i=1;i<=c;i++) h += `<tr><td class="p-3 border-b text-center font-medium text-slate-500 bg-slate-50/50">งวด ${i}</td><td class="p-3 border-b"><input type="number" class="inst-inp w-full border border-slate-300 p-2 rounded-lg outline-none focus:ring-2 focus:ring-primary text-right font-medium text-blue-700 transition" oninput="handlers.calcInst()"></td><td class="p-3 border-b text-right inst-pct text-slate-400 font-mono text-xs">0.00%</td></tr>`; h += `<tr><td class="p-4 bg-slate-50 font-bold text-center text-slate-600">รวมทั้งหมด</td><td class="p-4 bg-slate-50 font-bold text-right text-lg text-slate-800" id="inst_sum">0.00</td><td class="p-4 bg-slate-50 font-bold text-right text-emerald-600 text-lg" id="inst_pct_sum">0.00%</td></tr>`; t.innerHTML = h; handlers.calcInst(); },
            calcInst: () => { const contAmt = Number(document.getElementById('contract_amt').value||0); let sum = 0; document.querySelectorAll('.inst-inp').forEach((inp, idx) => { const v = Number(inp.value||0); sum += v; document.querySelectorAll('.inst-pct')[idx].innerText = contAmt>0 ? ((v/contAmt)*100).toFixed(2)+'%' : '0.00%'; }); const btn = document.getElementById('btn_save_c'); if(!btn) return; if(document.getElementById('inst_sum')) { document.getElementById('inst_sum').innerText = utils.formatMoney(sum); document.getElementById('inst_pct_sum').innerText = contAmt>0 ? ((sum/contAmt)*100).toFixed(2)+'%' : '0.00%'; const valid = sum > 0 && Math.abs(sum - contAmt) < 0.01; btn.disabled = !valid; btn.className = valid ? "bg-primary text-white px-6 py-3.5 rounded-xl w-full text-sm font-medium shadow-lg shadow-blue-500/30 transition hover:bg-blue-700" : "bg-slate-300 text-slate-500 px-6 py-3.5 rounded-xl w-full text-sm font-medium opacity-70 cursor-not-allowed"; document.getElementById('inst_err').classList[valid?'add':'remove']('hidden'); } else { btn.disabled = true; } },
            saveContract: async () => { const f = document.getElementById('c_file')?.files[0]; if(!f) return ui.toast('กรุณาแนบไฟล์สัญญา PDF', 'warning'); if(f.type !== 'application/pdf') return ui.toast('รองรับไฟล์ PDF เท่านั้น', 'error'); ui.showLoader('บันทึกสัญญา...'); try { const pid = state.selectedProject.id; const {data:upData} = await supabaseClient.storage.from('stips').upload(`contracts/${pid}/${Date.now()}.pdf`, f); const {data: cData, error} = await supabaseClient.from('contracts').upsert({ project_id: pid, signed_amount: Number(document.getElementById('contract_amt').value), remaining_budget: Number(document.getElementById('remain_amt').value.replace(/,/g,'')), contract_signed_date: document.getElementById('c_start').value, contract_end_date: document.getElementById('c_end').value, installment_count: Number(document.getElementById('inst_count').value), contract_document_path: upData?.path }, { onConflict: 'project_id' }).select(); if(error) throw error; await supabaseClient.from('contract_installments').delete().eq('contract_id', cData[0].id); const instList = []; const contAmt = Number(document.getElementById('contract_amt').value); document.querySelectorAll('.inst-inp').forEach((inp, i) => { const v = Number(inp.value); instList.push({ contract_id: cData[0].id, installment_no: i+1, installment_amount: v, percentage: (v/contAmt)*100 }); }); await supabaseClient.from('contract_installments').insert(instList); await handlers.updateStatus(8, "ลงนามเรียบร้อย เริ่มบริหารสัญญา"); ui.toast('ลงนามสัญญาสำเร็จ', 'success'); app.navigate('workflow', pid); } catch(e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); } },
            calcDisburseRow: (id, maxVal) => { const inp = document.getElementById(`paid_${id}`); let val = Number(inp.value || 0); if (val > maxVal) { ui.toast('เบิกจ่ายห้ามเกินยอดงวดงาน', 'warning'); val = maxVal; inp.value = maxVal; } document.getElementById(`pile_${id}`).innerText = utils.formatMoney(maxVal - val); let tPaid = 0; let tPile = 0; document.querySelectorAll('[id^="paid_"]').forEach(el => tPaid += Number(el.value || 0)); document.querySelectorAll('[id^="pile_"]').forEach(el => tPile += Number(el.innerText.replace(/,/g,'') || 0)); document.getElementById('total_paid').innerText = utils.formatMoney(tPaid); document.getElementById('total_pile').innerText = utils.formatMoney(tPile); },
            saveDisburse: async (instId) => { const paid = Number(document.getElementById(`paid_${instId}`).value); const dt = document.getElementById(`date_${instId}`).value; const det = document.getElementById(`det_${instId}`).value; if(!dt) return ui.toast('กรุณาระบุวันที่เบิกจ่าย', 'warning'); ui.showLoader('บันทึกเบิกจ่าย...'); try { await rpc('custom_save_disbursement', { p_session_token: state.sessionToken, p_installment_id: instId, p_paid_amount: paid, p_payment_date: dt, p_payment_detail: det }); ui.toast('สำเร็จ'); } catch(e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); } },
            saveProgress: async (contractId) => { const det = document.getElementById('prog_detail').value; if(!det) return ui.toast('กรุณาระบุรายละเอียด', 'warning'); ui.showLoader('บันทึกความก้าวหน้า...'); try { await rpc('custom_save_progress', { p_session_token: state.sessionToken, p_contract_id: contractId, p_progress_detail: det, p_problem_detail: document.getElementById('prog_prob').value, p_remark: document.getElementById('prog_rem').value }); ui.toast('สำเร็จ'); app.navigate('management', state.selectedProject.id); } catch(e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); } },
            
            // หน้า Users แบบเก่า (+เพิ่มเอง)
            openUserModal: () => { ui.openModal('เพิ่มบัญชีผู้ใช้งาน', `<form onsubmit="handlers.submitUser(event)" class="space-y-4"><div><label class="block text-sm font-medium mb-1">Username <span class="text-xs text-slate-400">(ชื่อสถานศึกษา)</span> <span class="text-red-500">*</span></label><input type="text" name="username" required class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-primary" placeholder="เช่น วิทยาลัยเทคนิค..."></div><div><label class="block text-sm font-medium mb-1">รหัสผ่าน <span class="text-red-500">*</span></label><input type="password" name="password" required minlength="6" class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-primary"></div><div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium mb-1">สิทธิ์การใช้งาน <span class="text-red-500">*</span></label><select name="role" required class="w-full px-4 py-2 border rounded-xl outline-none bg-white"><option value="user">User</option><option value="admin">Admin</option></select></div><div><label class="block text-sm font-medium mb-1">ชื่อ-นามสกุล <span class="text-xs text-slate-400">(เจ้าหน้าที่)</span></label><input type="text" name="full_name" class="w-full px-4 py-2 border rounded-xl outline-none"></div></div><button type="submit" class="w-full bg-primary text-white font-medium py-3 rounded-xl hover:bg-blue-800 transition">สร้างบัญชีผู้ใช้งาน</button></form>`); },
            submitUser: async (e) => { e.preventDefault(); ui.showLoader('กำลังสร้าง...'); try { const fd = new FormData(e.target); await rpc("admin_create_user", { p_session_token: state.sessionToken, p_username: fd.get('username'), p_password: fd.get('password'), p_role: fd.get('role'), p_institution_name: fd.get('username'), p_full_name: fd.get('full_name'), p_phone: '', p_email: '' }); ui.closeModal(); ui.toast('สำเร็จ'); app.navigate('users'); } catch(err) { ui.toast(err.message, 'error'); } finally { ui.hideLoader(); } },
            confirmDeleteUser: (userId, username) => { ui.openConfirm('ยืนยันลบ', `ลบ "${username}" ใช่หรือไม่?`, async () => { ui.showLoader(); try { await rpc("admin_delete_user", { p_session_token: state.sessionToken, p_user_id: userId }); ui.toast('ลบสำเร็จ'); app.navigate('users'); } catch(e) { ui.toast(e.message, 'error'); } finally { ui.hideLoader(); } }); }
        };

        const app = {
            initUserUI: () => {
                document.getElementById('user-fullname').innerText = state.user.full_name || 'วิทยาลัย';
                document.getElementById('user-role-badge').innerText = state.user.role === 'admin' ? 'ADMINISTRATOR' : 'INSTITUTION';
                const s = document.getElementById('nav-admin-section'); if(state.user.role === 'admin' && s) { s.classList.remove('hidden'); }
                document.getElementById('login-root').classList.add('hidden'); document.getElementById('app-root').classList.remove('hidden');
            },
            navigate: (route, param = null) => {
                state.currentRoute = route;
                document.querySelectorAll('#main-nav button').forEach(b => {
                    b.classList.remove('bg-blue-100', 'text-primary', 'font-bold');
                    if(b.dataset.nav === route || (route==='workflow' && b.dataset.nav==='projects') || (route==='management' && b.dataset.nav==='projects')) { b.classList.add('bg-blue-100', 'text-primary', 'font-bold'); }
                });
                ui.closeSidebar(); window.scrollTo(0,0);
                switch(route) { 
                    case 'dashboard': pages.dashboard(); break; 
                    case 'projects': pages.projects(); break; 
                    case 'workflow': pages.workflow(param); break; 
                    case 'management': pages.management(param); break; 
                    case 'profile': pages.profile(); break;
                    case 'users': pages.users(); break; 
                    case 'audit': pages.audit(); break; 
                    default: pages.dashboard(); 
                }
            },
            init: async () => {
                if (await auth.validate()) { 
                    app.initUserUI(); 
                    app.navigate('dashboard'); 
                } else { 
                    document.getElementById('app-root').classList.add('hidden'); 
                    document.getElementById('login-root').classList.remove('hidden'); 
                    handlers.loadLoginUsers(); 
                }
            }
        };
        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
