<script>

/* ======================================================
   CONFIG
====================================================== */

const SUPABASE_URL = "https://jfkqxwkukotmjaeuttcs.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_hEoWELY_mQr3E-5ldGB4og_82jI5BY_";


/*
   สำคัญ:
   ห้ามใช้ชื่อตัวแปรว่า supabase
*/

const supabaseClient =
    window.supabase.createClient(

/* ======================================================
   STATE
====================================================== */

const state = {

/* ======================================================
   HELPERS
====================================================== */

function esc(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function money(value) {

    return Number(value || 0)
        .toLocaleString("th-TH", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + " บาท";

}


function showLoader(text = "กำลังประมวลผล...") {

    const el =
        document.getElementById(
            "globalLoader"
        );

    document
        .getElementById(
            "globalLoaderText"
        )
        .textContent = text;

    el.classList.remove("hidden");

    el.classList.add("flex");

}


function hideLoader() {

    const el =
        document.getElementById(
            "globalLoader"
        );

    el.classList.add("hidden");

    el.classList.remove("flex");

}


function toast(
    message,
    type = "success"
) {

    const colors = {

        success:
            "bg-emerald-600",

        error:
            "bg-red-600",

        warning:
            "bg-amber-500",

        info:
            "bg-blue-600"

    };


    const icon = {

        success: "✓",

        error: "✕",

        warning: "!",

        info: "i"

    }[type];


    const el =
        document.createElement(
            "div"
        );


    el.className =
        `fixed z-[99999]
         top-4 right-4
         max-w-[calc(100vw-2rem)]
         ${colors[type]}
         text-white
         rounded-xl
         shadow-xl
         px-4 py-3
         flex items-start gap-3
         text-sm sm:text-base
         animate-[fadeIn_.2s_ease-out]`;


    el.innerHTML = `

        <div
            class="w-6 h-6
                   rounded-full
                   bg-white/20
                   flex items-center justify-center
                   shrink-0"
        >
            ${icon}
        </div>

        <div>
            ${esc(message)}
        </div>

    `;


    document.body.appendChild(el);


    setTimeout(() => {

        el.remove();

    }, 3500);

}


/* ======================================================
   SUPABASE RPC
====================================================== */

async function rpc(
    functionName,
    params = {}
) {

    try {

        const result =
            await supabaseClient.rpc(
                functionName,
                params
            );


        if (result.error) {

            console.error(
                result.error
            );

            throw new Error(
                result.error.message
            );

        }


        return result.data;

    }

    catch (error) {

        console.error(
            functionName,
            error
        );

        throw error;

    }

}


/* ======================================================
   AUTH
====================================================== */

async function login(
    username,
    password
) {

    showLoader(
        "กำลังเข้าสู่ระบบ..."
    );

    try {

        const data =
            await rpc(
                "custom_login",
                {
                    p_username: username,
                    p_password: password,
                    p_user_agent:
                        navigator.userAgent
                }
            );


        if (!data?.success) {

            throw new Error(
                data?.message ||
                "เข้าสู่ระบบไม่สำเร็จ"
            );

        }


        state.sessionToken =
            data.session_token;

        state.user =
            data.user;


        localStorage.setItem(
            "stips_session_token",
            state.sessionToken
        );


        localStorage.setItem(
            "stips_user",
            JSON.stringify(
                state.user
            )
        );


        toast(
            "เข้าสู่ระบบสำเร็จ",
            "success"
        );


        state.currentPage =
            "dashboard";


        renderApp();


        await loadDashboard();

    }

    catch (error) {

        toast(
            error.message ||
            "ไม่สามารถเข้าสู่ระบบได้",
            "error"
        );

    }

    finally {

        hideLoader();

    }

}


async function validateSession() {

    if (!state.sessionToken) {

        state.user = null;

        return false;

    }


    try {

        const data =
            await rpc(
                "custom_me",
                {
                    p_session_token:
                        state.sessionToken
                }
            );


        if (!data?.success) {

            logoutLocal();

            return false;

        }


        state.user =
            data.user;


        localStorage.setItem(
            "stips_user",
            JSON.stringify(
                state.user
            )
        );


        return true;

    }

    catch (error) {

        console.error(error);

        logoutLocal();

        return false;

    }

}


function logoutLocal() {

    state.sessionToken = null;

    state.user = null;

    state.projects = [];

    state.users = [];

    state.dashboard = null;


    localStorage.removeItem(
        "stips_session_token"
    );

    localStorage.removeItem(
        "stips_user"
    );

}


async function logout() {

    if (!state.sessionToken) {

        logoutLocal();

        renderApp();

        return;

    }


    showLoader(
        "กำลังออกจากระบบ..."
    );


    try {

        await rpc(
            "custom_logout",
            {
                p_session_token:
                    state.sessionToken
            }
        );

    }

    catch (error) {

        console.error(error);

    }

    finally {

        logoutLocal();

        hideLoader();

        renderApp();

        toast(
            "ออกจากระบบแล้ว",
            "success"
        );

    }

}

        state.dashboard =

    }

async function createProject(
    event
) {

    event.preventDefault();


    const form =
        event.target;


    const fd =
        new FormData(form);


    showLoader(
        "กำลังบันทึกโครงการ..."
    );


    try {

        const data =
            await rpc(
                "custom_create_project",
                {

                    p_session_token:
                        state.sessionToken,

                    p_project_code:
                        fd.get(
                            "project_code"
                        ),

                    p_project_name:
                        fd.get(
                            "project_name"
                        ),

                    p_project_type:
                        fd.get(
                            "project_type"
                        ),

                    p_budget_amount:
                        Number(
                            fd.get(
                                "budget_amount"
                            )
                        )

                }
            );


        if (!data?.success) {

            throw new Error(
                data?.message ||
                "สร้างโครงการไม่สำเร็จ"
            );

        }


        closeProjectModal();

        toast(
            "สร้างโครงการสำเร็จ",
            "success"
        );


        await loadProjects();

        await loadDashboard();

    }

    catch (error) {

        toast(
            error.message,
            "error"
        );

    }

    finally {

        hideLoader();

    }

}

                        state.sessionToken,

                    p_username:
                        fd.get("username"),

                    p_password:
                        fd.get("password"),

                    p_role:
                        fd.get("role"),

                    p_institution_id:
                        fd.get("institution_id") ||
                        null,

                    p_full_name:
                        fd.get("full_name"),

                    p_phone:

/* ======================================================
   SIMPLE CSV REPORT
====================================================== */

function downloadCSV(
    filename,
    rows
) {

    const csv =
        rows.map(
            row =>
                row.map(
                    cell =>
                        `"${String(
                            cell ?? ""
                        ).replaceAll(
                            '"',
                            '""'
                        )}"`
                ).join(",")
        ).join("\n");


    const blob =
        new Blob(
            [
                "\uFEFF" +
                csv
            ],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href = url;

    a.download =
        filename;

    a.click();

    URL.revokeObjectURL(
        url
    );

}

            "สถานะ",
            "วิทยาลัย"
        ]

    ];


    state.projects.forEach(
        p => {

            rows.push([

                p.project_code,

                p.project_name,

                p.project_type,

                p.budget_amount,

                p.status_name,

                p.institution_name || ""

            ]);

    );


    downloadCSV(
        "stips-projects.csv",

                "ชื่อ",
                "Role",
                "วิทยาลัย",
                "สถานะ"
            ],

            ...state.users.map(
                u => [

                    u.username,

                    u.full_name,

                    u.role,

                    u.institution_name ||
                    "",

                    u.is_active
                    ? "ใช้งาน"
                    : "ปิด"

                ]
            )

        ]
    );


    toast(
        "ดาวน์โหลดรายงานแล้ว",
        "success"
    );

}


/* ======================================================
   CONFIRM MODAL
====================================================== */

function confirmModal(
    title,
    message,
    action
) {

    const modal =
        document.createElement(
            "div"
        );


    modal.className =
        "fixed inset-0 z-[90] bg-black/40 flex items-end sm:items-center justify-center p-4";


    modal.innerHTML = `

        <div
            class="bg-white
                   w-full
                   max-w-md
                   rounded-2xl
                   p-5
                   shadow-xl"
        >

            <div
                class="text-lg
                       font-semibold"
            >
                ${esc(title)}
            </div>

            <div
                class="text-sm
                       text-slate-500
                       mt-2
                       leading-6"
            >
                ${esc(message)}
            </div>


            <div
                class="mt-6
                       grid
                       grid-cols-2
                       gap-3"
            >

                <button
                    class="h-11
                           rounded-xl
                           bg-slate-100"
                    onclick="this.closest('.fixed').remove()"
                >
                    ยกเลิก
                </button>


                <button
                    id="confirmActionButton"
                    class="h-11
                           rounded-xl
                           bg-red-600
                           text-white"
                >
                    ยืนยัน
                </button>

            </div>

        </div>

    `;


    document.body.appendChild(
        modal
    );


    modal
        .querySelector(
            "#confirmActionButton"
        )
        .onclick =
        async () => {

            modal.remove();

            await action();

        };

}


function confirmLogout() {

    confirmModal(
        "ออกจากระบบ",
        "ต้องการออกจากระบบหรือไม่?",
        logout
    );

}

/* ======================================================
   NAVIGATION
====================================================== */

async function navigate(
    page
) {

    state.mobileAdminPanel =
        false;


    state.currentPage =
        page;


    renderApp();


    if (page === "dashboard") {

        await loadDashboard();

    }


    if (page === "projects") {

        await loadProjects();

    }


    if (page === "users") {

        await loadUsers();

    }

}


function toggleAdminPanel() {

    state.mobileAdminPanel =
        !state.mobileAdminPanel;

    renderApp();

}


function closeAdminPanel(
    event
) {

    if (
        event.target ===
        event.currentTarget
    ) {

        state.mobileAdminPanel =
            false;

        renderApp();

    }

}


function adminAction(
    id
) {

    state.mobileAdminPanel =
        false;


    if (id === "users") {

        navigate("users");

        return;

    }


    if (id === "reports") {

        navigate("reports");

        return;

    }


    if (id === "allProjects") {

        navigate("projects");

        return;

    }


    toast(
        "เมนูนี้จะเชื่อมต่อในโมดูลถัดไป",
        "info"
    );

}


/* ======================================================
   MAIN RENDER
====================================================== */

function renderApp() {

    const root =
        document.getElementById(
            "app"
        );


    if (!state.user) {

        root.innerHTML =
            loginPage();

        document
            .getElementById(
                "loginForm"
            )
            ?.addEventListener(
                "submit",
                event => {

                    event.preventDefault();

                    login(

                        document
                            .getElementById(
                                "loginUsername"
                            )
                            .value
                            .trim(),

                        document
                            .getElementById(
                                "loginPassword"
                            )
                            .value

                    );

                }
            );

        return;

    }


    let content = "";


    switch (
        state.currentPage
    ) {

        case "dashboard":

            content =
                dashboardPage();

            break;


        case "projects":

            content =
                projectsPage();

            break;


        case "reports":

            content =
                reportsPage();

            break;


        case "users":

            content =
                usersPage();

            break;


        default:

            content =
                dashboardPage();

    }


    root.innerHTML =
        shell(content);

}


/* ======================================================
   INITIALIZE
====================================================== */

async function init() {

    renderApp();


    const valid =
        await validateSession();


    if (!valid) {

        renderApp();

        return;

    }


    renderApp();


    await loadDashboard();

}


init();

</script>
